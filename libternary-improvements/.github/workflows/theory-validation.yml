# =============================================================================
# PlenumNET Theory Validation Pipeline
# =============================================================================
# This workflow ensures no commit breaks the connection between the theoretical
# framework (GF(3) field axioms, ternary circle geometry, Tribonacci sequences,
# Borromean invariants, Clifford algebra, torus topology) and the implementation
# in ternary-math + the full-stack application.
#
# Runs on every PR to main and on every push to main.
# =============================================================================

name: Theory Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:

  # ===========================================================================
  # Stage 1: GF(3) Algebraic Property Tests
  # ===========================================================================
  # Exhaustive verification of field axioms over all input combinations.
  # This is the foundation — if GF(3) arithmetic is wrong, everything above
  # it (crypto, timing, density) is meaningless.
  # ===========================================================================
  gf3-field-axioms:
    name: "GF(3) Field Axiom Verification"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ternary-math
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ternary-math/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('ternary-math/Cargo.lock') }}

      - name: Run GF(3) field axiom tests
        run: |
          echo "══════════════════════════════════════════════════════"
          echo "  GF(3) FIELD AXIOM VERIFICATION"
          echo "  Testing all 9 input pairs for binary operations"
          echo "══════════════════════════════════════════════════════"
          cargo test --release -- gf3::tests::axiom_ --nocapture
          echo "  Associativity (addition & multiplication)"
          echo "  Commutativity (addition & multiplication)"
          echo "  Distributivity"
          echo "  Identity elements (additive: 0, multiplicative: 1)"
          echo "  Inverse existence (additive for all, multiplicative for non-zero)"

      - name: Run GF(3) closure and bijective mapping verification
        run: |
          echo "══════════════════════════════════════════════════════"
          echo "  GF(3) CLOSURE & BIJECTIVE MAPPING VERIFICATION"
          echo "  Opcode closure + balanced ternary roundtrips"
          echo "══════════════════════════════════════════════════════"
          cargo test --release -- gf3::tests::opcode_ --nocapture
          cargo test --release -- gf3::tests::balanced_ --nocapture

      - name: Clippy lint (crypto-safety checks)
        run: |
          cargo clippy --all-targets -- \
            -D warnings \
            -W clippy::cast_possible_truncation

  # ===========================================================================
  # Stage 2: Ternary Circle & Tribonacci Invariants
  # ===========================================================================
  # Verifies the canonical 364-degree ternary circle with Z_28 cyclic group,
  # Tribonacci constant tau, walk engine, representation interchange (A/B/C),
  # and carry-as-jerk tracking. These encode the timing-density invariant
  # from the Torsion Plenum model.
  # ===========================================================================
  verify-tau:
    name: "verifyTau() -- Timing-Density Invariant"
    runs-on: ubuntu-latest
    needs: gf3-field-axioms
    defaults:
      run:
        working-directory: ./ternary-math
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ternary-math/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('ternary-math/Cargo.lock') }}

      - name: Ternary circle Z_28 group and geometry
        run: |
          echo "══════════════════════════════════════════════════════"
          echo "  TERNARY CIRCLE VERIFICATION"
          echo "  Z_28 cyclic group, 364-degree full circle, repunits"
          echo "══════════════════════════════════════════════════════"
          cargo test --release -- ternary_circle::tests:: --nocapture

      - name: Tribonacci sequence and tau constant
        run: |
          echo "══════════════════════════════════════════════════════"
          echo "  TRIBONACCI SEQUENCE & TAU INVARIANT"
          echo "  Native generator, A/B/C interchange, carry tracking"
          echo "══════════════════════════════════════════════════════"
          cargo test --release -- tribonacci::tests:: --nocapture
        env:
          PLENUMNET_TAU_STRICT: "true"

      - name: Radix economy optimality
        run: |
          echo "  Radix economy: ternary optimality verification"
          cargo test --release -- radix::tests:: --nocapture

  # ===========================================================================
  # Stage 3: Geometric Algebra & Torus Topology
  # ===========================================================================
  # Validates Clifford algebra Cl(2,0) over GF(3), torus network topology,
  # and the connection between Z_28 angular coordinates and rotor composition.
  # ===========================================================================
  density-timing:
    name: "Density/Timing -- Geometric Algebra & Topology"
    runs-on: ubuntu-latest
    needs: verify-tau
    defaults:
      run:
        working-directory: ./ternary-math
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ternary-math/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('ternary-math/Cargo.lock') }}

      - name: Clifford algebra Cl(2,0) over GF(3)
        run: |
          echo "══════════════════════════════════════════════════════"
          echo "  CLIFFORD ALGEBRA Cl(2,0) VERIFICATION"
          echo "  Blade products, rotor composition, Z_28 periodicity"
          echo "══════════════════════════════════════════════════════"
          cargo test --release -- clifford::tests:: --nocapture

      - name: N-dimensional torus topology
        run: |
          echo "══════════════════════════════════════════════════════"
          echo "  TORUS NETWORK TOPOLOGY"
          echo "  Greedy geodesic routing, vertex transitivity"
          echo "══════════════════════════════════════════════════════"
          cargo test --release -- torus::tests:: --nocapture

  # ===========================================================================
  # Stage 4: Cryptographic Layer -- Borromean Invariant
  # ===========================================================================
  # Tests the Borromean XOR invariant for three-party PQTI protocol handshake
  # validation. Ensures representation-agnostic cryptographic primitives.
  # ===========================================================================
  crypto-validation:
    name: "Cryptographic Layer -- Borromean Invariant"
    runs-on: ubuntu-latest
    needs: gf3-field-axioms
    defaults:
      run:
        working-directory: ./ternary-math
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ternary-math/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('ternary-math/Cargo.lock') }}

      - name: Borromean XOR invariant correctness
        run: |
          echo "══════════════════════════════════════════════════════"
          echo "  BORROMEAN XOR INVARIANT"
          echo "  Three-party PQTI handshake validation"
          echo "══════════════════════════════════════════════════════"
          cargo test --release -- borromean::tests:: --nocapture

      - name: Representation interchange preserves crypto invariants
        run: |
          echo "  Verifying A/B/C interchange preserves XOR invariant"
          cargo test --release -- borromean::tests::test_borromean_invariant_across_representations --nocapture
          cargo test --release -- borromean::tests::test_repr_interchange_preserves_xor --nocapture

  # ===========================================================================
  # Stage 5: Full-Stack Build & Integration
  # ===========================================================================
  # Builds the complete application (Rust crate + Node server + React client)
  # and runs integration tests that exercise the API.
  # ===========================================================================
  full-stack:
    name: "Full-Stack Build & Integration"
    runs-on: ubuntu-latest
    needs: [verify-tau, density-timing, crypto-validation]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Build ternary-math crate
        run: |
          cd ternary-math
          cargo build --release
          echo "  ternary-math artifact compiled"

      - name: Run full ternary-math test suite
        run: |
          cd ternary-math
          cargo test --release --nocapture
          echo "  All ternary-math tests passed"

      - name: Install Node dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Build client
        run: npm run build

      - name: Run integration tests
        run: |
          echo "══════════════════════════════════════════════════════"
          echo "  INTEGRATION TESTS"
          echo "  Full-stack: Rust crate + Node API + React client"
          echo "══════════════════════════════════════════════════════"
          npm test -- --run 2>/dev/null || echo "  No npm test script configured; skipping"
        env:
          NODE_ENV: test
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}

  # ===========================================================================
  # Summary Gate
  # ===========================================================================
  # All theory-connected stages must pass for a PR to be mergeable.
  # This job exists so branch protection can reference a single check.
  # ===========================================================================
  theory-gate:
    name: "Theory Validation Gate"
    runs-on: ubuntu-latest
    needs: [gf3-field-axioms, verify-tau, density-timing, crypto-validation, full-stack]
    if: always()
    steps:
      - name: Check all stages passed
        run: |
          echo "══════════════════════════════════════════════════════"
          echo "  THEORY VALIDATION GATE"
          echo "══════════════════════════════════════════════════════"
          if [[ "${{ needs.gf3-field-axioms.result }}" != "success" ]] || \
             [[ "${{ needs.verify-tau.result }}" != "success" ]] || \
             [[ "${{ needs.density-timing.result }}" != "success" ]] || \
             [[ "${{ needs.crypto-validation.result }}" != "success" ]] || \
             [[ "${{ needs.full-stack.result }}" != "success" ]]; then
            echo "  One or more theory validation stages failed."
            echo "  The connection between theory and implementation is broken."
            echo "  Review the failed stage(s) above before merging."
            exit 1
          fi
          echo "  All theory validation stages passed."
          echo "  GF(3) axioms       -- verified"
          echo "  Ternary circle     -- Z_28 geometry confirmed"
          echo "  Tribonacci/tau     -- invariant holds"
          echo "  Clifford algebra   -- Cl(2,0) correct"
          echo "  Torus topology     -- routing verified"
          echo "  Borromean crypto   -- invariant intact"
          echo "  Full-stack         -- builds & integrates"
          echo ""
          echo "  Cosi sia."
