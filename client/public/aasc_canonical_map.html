<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AASC Canonical Map</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0F0C0A; overflow: hidden; }
  #stage { position: absolute; inset: 0; overflow: hidden; cursor: grab; }
  #stage.dragging { cursor: grabbing; }
  #stage svg { display: block; transform-origin: 0 0; user-select: none; }
</style>
</head>
<body>
<div id="stage"><div id="content"></div></div>
<script>
(async function () {
  const stage = document.getElementById('stage');
  const content = document.getElementById('content');
  const res = await fetch('/aasc_canonical_map.svg', { cache: 'no-store' });
  content.innerHTML = await res.text();
  const svg = content.querySelector('svg');
  if (!svg) return;
  const vb = svg.viewBox.baseVal;
  const svgW = vb && vb.width  ? vb.width  : (svg.width.baseVal.value  || 1000);
  const svgH = vb && vb.height ? vb.height : (svg.height.baseVal.value || 1000);
  svg.removeAttribute('width');
  svg.removeAttribute('height');
  svg.style.width  = svgW + 'px';
  svg.style.height = svgH + 'px';

  let scale = 1, tx = 0, ty = 0;
  function apply() { svg.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')'; }
  function fit() {
    const sw = stage.clientWidth, sh = stage.clientHeight;
    scale = Math.min(sw / svgW, sh / svgH);
    tx = (sw - svgW * scale) / 2;
    ty = (sh - svgH * scale) / 2;
    apply();
  }
  function zoomAt(cx, cy, factor) {
    const next = Math.max(0.02, Math.min(60, scale * factor));
    const r = next / scale;
    tx = cx - (cx - tx) * r;
    ty = cy - (cy - ty) * r;
    scale = next;
    apply();
  }
  stage.addEventListener('wheel', (e) => {
    e.preventDefault();
    const r = stage.getBoundingClientRect();
    zoomAt(e.clientX - r.left, e.clientY - r.top, e.deltaY < 0 ? 1.2 : 1 / 1.2);
  }, { passive: false });
  stage.addEventListener('dblclick', fit);
  let drag = false, lx = 0, ly = 0;
  stage.addEventListener('mousedown', (e) => { drag = true; stage.classList.add('dragging'); lx = e.clientX; ly = e.clientY; });
  window.addEventListener('mousemove', (e) => { if (!drag) return; tx += e.clientX - lx; ty += e.clientY - ly; lx = e.clientX; ly = e.clientY; apply(); });
  window.addEventListener('mouseup', () => { drag = false; stage.classList.remove('dragging'); });
  window.addEventListener('keydown', (e) => {
    if (e.key === '0') fit();
    if (e.key === '+' || e.key === '=') zoomAt(stage.clientWidth/2, stage.clientHeight/2, 1.25);
    if (e.key === '-' || e.key === '_') zoomAt(stage.clientWidth/2, stage.clientHeight/2, 0.8);
  });
  fit();
})();
</script>
</body>
</html>
