[package]
name = "plenum-pass-helper"
version = "1.0.0"
edition = "2021"
description = "Secure passphrase collection helper for PlenumNET installers"
publish = false

[[bin]]
name = "plenum-pass-helper"
path = "src/main.rs"

[dependencies]
anyhow = "=1.0.80"
clap = { version = "=4.4.18", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_System_Console"] }
