[package]
name = "plenum-pack"
version = "1.0.0"
edition = "2021"
description = "Manifest-driven MSI build tool for PlenumNET applications"
license = "Proprietary"
publish = false

[dependencies]
clap = { version = "=4.4.18", features = ["derive"] }
toml = "=0.8.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "=1.6.1", features = ["v5", "v4"] }
semver = "=1.0.22"
regex = "=1.10.3"
walkdir = "=2.4.0"
anyhow = "=1.0.80"
thiserror = "=1.0.57"
