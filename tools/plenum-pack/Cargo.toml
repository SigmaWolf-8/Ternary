[package]
name = "plenum-pack"
version = "1.0.0"
edition = "2021"
description = "Manifest-driven MSI build tool for PlenumNET applications"
license = "Proprietary"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v5", "v4"] }
semver = "1"
regex = "1"
walkdir = "2"
anyhow = "1"
thiserror = "1"
