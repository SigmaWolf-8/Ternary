[package]
name = "mock-crs"
version = "0.1.0"
edition = "2021"
description = "Mock Cube Registration Service for CI testing of Inter-Cube Daemon installation"
license = "Proprietary"
publish = false

[dependencies]
axum = "=0.7.4"
tokio = { version = "=1.36.0", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "=1.0.80"
uuid = { version = "=1.6.1", features = ["v4"] }
