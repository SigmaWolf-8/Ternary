[package]
name = "plenum-launcher"
version = "1.0.0"
edition = "2021"
description = "PlenumNET Launcher -- system tray hub for all installed PlenumNET applications"
license = "Proprietary"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
thiserror = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows = { version = "0.58", features = [
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Services",
    "Win32_Foundation",
    "Win32_System_Registry",
] }
tao = "0.31"
wry = "0.47"
tray-icon = "0.19"
muda = "0.15"
image = { version = "0.25", default-features = false, features = ["png"] }
