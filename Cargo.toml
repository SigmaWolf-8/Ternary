[workspace]
members = [
    "ternary-math",
    "ternary-math/napi",
    "src/kernel",
    "src/plenum-std",
    "services/pqti-service",
    "services/inter-cube",
    "services/tdns-v2",
    "plenumlan",
    "tools/plenum-pack",
    "tools/plenum-launcher",
    "tools/plenum-launcher-elevate",
    "tools/plenum-pass-helper",
    "tools/plenum-pass-ca",
    "tools/plenum-pack/ci-tests/mock-crs",
    "ninja-exec",
]
exclude = [
    "libternary",
    "src/kernel/bare-metal",
]
resolver = "2"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
