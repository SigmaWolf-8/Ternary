<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" font-family="system-ui, -apple-system, sans-serif">
  <rect width="800" height="340" fill="#0F0C0A"/>

  <text x="30" y="36" fill="#ECE8DF" font-size="18" font-weight="bold">Replace the Green — Round 2</text>
  <text x="30" y="56" fill="#8A8173" font-size="12">All shown on the actual page background, next to Primary Blue for context.</text>

  <!-- Option 1: Cool Gray -->
  <rect x="30" y="80" width="160" height="100" rx="9" fill="#181411" stroke="#272220" stroke-width="1"/>
  <rect x="55" y="100" width="110" height="36" rx="6" fill="#78828C"/>
  <text x="110" y="124" fill="#FFF" font-size="14" font-weight="bold" text-anchor="middle">A</text>
  <text x="110" y="158" fill="#8A8173" font-size="11" font-family="monospace" text-anchor="middle">#78828C</text>
  <text x="110" y="172" fill="#5E5851" font-size="10" text-anchor="middle">Cool Slate</text>

  <!-- Option 2: Ice Blue -->
  <rect x="210" y="80" width="160" height="100" rx="9" fill="#181411" stroke="#272220" stroke-width="1"/>
  <rect x="235" y="100" width="110" height="36" rx="6" fill="#7AAFCC"/>
  <text x="290" y="124" fill="#0F0C0A" font-size="14" font-weight="bold" text-anchor="middle">B</text>
  <text x="290" y="158" fill="#8A8173" font-size="11" font-family="monospace" text-anchor="middle">#7AAFCC</text>
  <text x="290" y="172" fill="#5E5851" font-size="10" text-anchor="middle">Ice Blue</text>

  <!-- Option 3: Chalk White -->
  <rect x="390" y="80" width="160" height="100" rx="9" fill="#181411" stroke="#272220" stroke-width="1"/>
  <rect x="415" y="100" width="110" height="36" rx="6" fill="#B8BFC6"/>
  <text x="470" y="124" fill="#0F0C0A" font-size="14" font-weight="bold" text-anchor="middle">C</text>
  <text x="470" y="158" fill="#8A8173" font-size="11" font-family="monospace" text-anchor="middle">#B8BFC6</text>
  <text x="470" y="172" fill="#5E5851" font-size="10" text-anchor="middle">Chalk</text>

  <!-- Option 4: Gunmetal -->
  <rect x="570" y="80" width="160" height="100" rx="9" fill="#181411" stroke="#272220" stroke-width="1"/>
  <rect x="595" y="100" width="110" height="36" rx="6" fill="#5C6670"/>
  <text x="650" y="124" fill="#FFF" font-size="14" font-weight="bold" text-anchor="middle">D</text>
  <text x="650" y="158" fill="#8A8173" font-size="11" font-family="monospace" text-anchor="middle">#5C6670</text>
  <text x="650" y="172" fill="#5E5851" font-size="10" text-anchor="middle">Gunmetal</text>

  <!-- Option 5: Pale Steel -->
  <rect x="30" y="200" width="160" height="100" rx="9" fill="#181411" stroke="#272220" stroke-width="1"/>
  <rect x="55" y="220" width="110" height="36" rx="6" fill="#8E9BAA"/>
  <text x="110" y="244" fill="#0F0C0A" font-size="14" font-weight="bold" text-anchor="middle">E</text>
  <text x="110" y="278" fill="#8A8173" font-size="11" font-family="monospace" text-anchor="middle">#8E9BAA</text>
  <text x="110" y="292" fill="#5E5851" font-size="10" text-anchor="middle">Pale Steel</text>

  <!-- Context row: all next to Blue and Rose -->
  <text x="230" y="230" fill="#8A8173" font-size="12">Full palette context:</text>

  <rect x="230" y="245" width="60" height="32" rx="5" fill="#4A9EF5"/>
  <text x="260" y="266" fill="#FFF" font-size="10" font-weight="bold" text-anchor="middle">Blue</text>

  <rect x="298" y="245" width="60" height="32" rx="5" fill="#78828C"/>
  <text x="328" y="266" fill="#FFF" font-size="10" font-weight="bold" text-anchor="middle">A</text>

  <rect x="366" y="245" width="60" height="32" rx="5" fill="#7AAFCC"/>
  <text x="396" y="266" fill="#0F0C0A" font-size="10" font-weight="bold" text-anchor="middle">B</text>

  <rect x="434" y="245" width="60" height="32" rx="5" fill="#B8BFC6"/>
  <text x="464" y="266" fill="#0F0C0A" font-size="10" font-weight="bold" text-anchor="middle">C</text>

  <rect x="502" y="245" width="60" height="32" rx="5" fill="#5C6670"/>
  <text x="532" y="266" fill="#FFF" font-size="10" font-weight="bold" text-anchor="middle">D</text>

  <rect x="570" y="245" width="60" height="32" rx="5" fill="#8E9BAA"/>
  <text x="600" y="266" fill="#0F0C0A" font-size="10" font-weight="bold" text-anchor="middle">E</text>

  <rect x="646" y="245" width="60" height="32" rx="5" fill="#D46B8A"/>
  <text x="676" y="266" fill="#FFF" font-size="10" font-weight="bold" text-anchor="middle">Rose</text>

  <rect x="714" y="245" width="60" height="32" rx="5" fill="#A87FD4"/>
  <text x="744" y="266" fill="#FFF" font-size="10" font-weight="bold" text-anchor="middle">Purple</text>
</svg>
