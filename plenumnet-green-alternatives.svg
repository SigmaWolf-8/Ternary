<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" font-family="system-ui, -apple-system, sans-serif">
  <rect width="800" height="380" fill="#0F0C0A"/>

  <text x="30" y="36" fill="#ECE8DF" font-size="18" font-weight="bold">Replace the Green — Pick One</text>
  <text x="30" y="56" fill="#8A8173" font-size="12">Current green: #40BF6E. Here are 4 alternatives on the actual site background.</text>

  <!-- Current Green -->
  <rect x="30" y="80" width="160" height="100" rx="9" fill="#181411" stroke="#272220" stroke-width="1"/>
  <rect x="55" y="100" width="110" height="36" rx="6" fill="#40BF6E"/>
  <text x="110" y="124" fill="#0F0C0A" font-size="14" font-weight="bold" text-anchor="middle">Current</text>
  <text x="110" y="158" fill="#8A8173" font-size="11" font-family="monospace" text-anchor="middle">#40BF6E</text>
  <text x="110" y="172" fill="#5E5851" font-size="10" text-anchor="middle">Green</text>

  <!-- Option 1: Silver Steel -->
  <rect x="210" y="80" width="160" height="100" rx="9" fill="#181411" stroke="#272220" stroke-width="1"/>
  <rect x="235" y="100" width="110" height="36" rx="6" fill="#9CA3AF"/>
  <text x="290" y="124" fill="#0F0C0A" font-size="14" font-weight="bold" text-anchor="middle">Option A</text>
  <text x="290" y="158" fill="#8A8173" font-size="11" font-family="monospace" text-anchor="middle">#9CA3AF</text>
  <text x="290" y="172" fill="#5E5851" font-size="10" text-anchor="middle">Silver Steel</text>

  <!-- Option 2: Warm Gray -->
  <rect x="390" y="80" width="160" height="100" rx="9" fill="#181411" stroke="#272220" stroke-width="1"/>
  <rect x="415" y="100" width="110" height="36" rx="6" fill="#A09890"/>
  <text x="470" y="124" fill="#0F0C0A" font-size="14" font-weight="bold" text-anchor="middle">Option B</text>
  <text x="470" y="158" fill="#8A8173" font-size="11" font-family="monospace" text-anchor="middle">#A09890</text>
  <text x="470" y="172" fill="#5E5851" font-size="10" text-anchor="middle">Warm Gray</text>

  <!-- Option 3: Muted Teal -->
  <rect x="570" y="80" width="160" height="100" rx="9" fill="#181411" stroke="#272220" stroke-width="1"/>
  <rect x="595" y="100" width="110" height="36" rx="6" fill="#5B9EA6"/>
  <text x="650" y="124" fill="#0F0C0A" font-size="14" font-weight="bold" text-anchor="middle">Option C</text>
  <text x="650" y="158" fill="#8A8173" font-size="11" font-family="monospace" text-anchor="middle">#5B9EA6</text>
  <text x="650" y="172" fill="#5E5851" font-size="10" text-anchor="middle">Muted Teal</text>

  <!-- Option 4: Soft Amber -->
  <rect x="30" y="210" width="160" height="100" rx="9" fill="#181411" stroke="#272220" stroke-width="1"/>
  <rect x="55" y="230" width="110" height="36" rx="6" fill="#C8A96E"/>
  <text x="110" y="254" fill="#0F0C0A" font-size="14" font-weight="bold" text-anchor="middle">Option D</text>
  <text x="110" y="288" fill="#8A8173" font-size="11" font-family="monospace" text-anchor="middle">#C8A96E</text>
  <text x="110" y="302" fill="#5E5851" font-size="10" text-anchor="middle">Soft Amber</text>

  <!-- Context: shown next to Primary Blue for comparison -->
  <text x="230" y="240" fill="#8A8173" font-size="12">For reference — next to Primary Blue:</text>

  <rect x="230" y="255" width="80" height="36" rx="6" fill="#4A9EF5"/>
  <text x="270" y="278" fill="#FFF" font-size="11" font-weight="bold" text-anchor="middle">Blue</text>

  <rect x="320" y="255" width="80" height="36" rx="6" fill="#9CA3AF"/>
  <text x="360" y="278" fill="#0F0C0A" font-size="11" font-weight="bold" text-anchor="middle">A</text>

  <rect x="410" y="255" width="80" height="36" rx="6" fill="#A09890"/>
  <text x="450" y="278" fill="#0F0C0A" font-size="11" font-weight="bold" text-anchor="middle">B</text>

  <rect x="500" y="255" width="80" height="36" rx="6" fill="#5B9EA6"/>
  <text x="540" y="278" fill="#0F0C0A" font-size="11" font-weight="bold" text-anchor="middle">C</text>

  <rect x="590" y="255" width="80" height="36" rx="6" fill="#C8A96E"/>
  <text x="630" y="278" fill="#0F0C0A" font-size="11" font-weight="bold" text-anchor="middle">D</text>

  <!-- Rose for reference -->
  <rect x="230" y="305" width="80" height="36" rx="6" fill="#D46B8A"/>
  <text x="270" y="328" fill="#FFF" font-size="11" font-weight="bold" text-anchor="middle">Rose</text>

  <text x="320" y="328" fill="#5E5851" font-size="11">← existing accent colors for context</text>
</svg>
