<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" font-family="system-ui, -apple-system, sans-serif">
  <rect width="800" height="340" fill="#0F0C0A"/>

  <text x="30" y="36" fill="#ECE8DF" font-size="18" font-weight="bold">Replace the Purple — Darker Grays</text>
  <text x="30" y="56" fill="#8A8173" font-size="12">All on the actual page background. Current purple (#A87FD4) shown for reference.</text>

  <!-- Current Purple -->
  <rect x="30" y="80" width="160" height="100" rx="9" fill="#181411" stroke="#272220" stroke-width="1"/>
  <rect x="55" y="100" width="110" height="36" rx="6" fill="#A87FD4"/>
  <text x="110" y="124" fill="#FFF" font-size="14" font-weight="bold" text-anchor="middle">Current</text>
  <text x="110" y="158" fill="#8A8173" font-size="11" font-family="monospace" text-anchor="middle">#A87FD4</text>
  <text x="110" y="172" fill="#5E5851" font-size="10" text-anchor="middle">Purple</text>

  <!-- Option A: Dark Steel -->
  <rect x="210" y="80" width="160" height="100" rx="9" fill="#181411" stroke="#272220" stroke-width="1"/>
  <rect x="235" y="100" width="110" height="36" rx="6" fill="#505962"/>
  <text x="290" y="124" fill="#FFF" font-size="14" font-weight="bold" text-anchor="middle">A</text>
  <text x="290" y="158" fill="#8A8173" font-size="11" font-family="monospace" text-anchor="middle">#505962</text>
  <text x="290" y="172" fill="#5E5851" font-size="10" text-anchor="middle">Dark Steel</text>

  <!-- Option B: Charcoal -->
  <rect x="390" y="80" width="160" height="100" rx="9" fill="#181411" stroke="#272220" stroke-width="1"/>
  <rect x="415" y="100" width="110" height="36" rx="6" fill="#454D55"/>
  <text x="470" y="124" fill="#FFF" font-size="14" font-weight="bold" text-anchor="middle">B</text>
  <text x="470" y="158" fill="#8A8173" font-size="11" font-family="monospace" text-anchor="middle">#454D55</text>
  <text x="470" y="172" fill="#5E5851" font-size="10" text-anchor="middle">Charcoal</text>

  <!-- Option C: Smoke -->
  <rect x="570" y="80" width="160" height="100" rx="9" fill="#181411" stroke="#272220" stroke-width="1"/>
  <rect x="595" y="100" width="110" height="36" rx="6" fill="#606870"/>
  <text x="650" y="124" fill="#FFF" font-size="14" font-weight="bold" text-anchor="middle">C</text>
  <text x="650" y="158" fill="#8A8173" font-size="11" font-family="monospace" text-anchor="middle">#606870</text>
  <text x="650" y="172" fill="#5E5851" font-size="10" text-anchor="middle">Smoke</text>

  <!-- Option D: Iron -->
  <rect x="30" y="200" width="160" height="100" rx="9" fill="#181411" stroke="#272220" stroke-width="1"/>
  <rect x="55" y="220" width="110" height="36" rx="6" fill="#3D444B"/>
  <text x="110" y="244" fill="#FFF" font-size="14" font-weight="bold" text-anchor="middle">D</text>
  <text x="110" y="278" fill="#8A8173" font-size="11" font-family="monospace" text-anchor="middle">#3D444B</text>
  <text x="110" y="292" fill="#5E5851" font-size="10" text-anchor="middle">Iron</text>

  <!-- Context row: full palette -->
  <text x="230" y="230" fill="#8A8173" font-size="12">Full palette context:</text>

  <rect x="230" y="245" width="60" height="32" rx="5" fill="#4A9EF5"/>
  <text x="260" y="266" fill="#FFF" font-size="10" font-weight="bold" text-anchor="middle">Blue</text>

  <rect x="298" y="245" width="60" height="32" rx="5" fill="#78828C"/>
  <text x="328" y="266" fill="#FFF" font-size="10" font-weight="bold" text-anchor="middle">Slate</text>

  <rect x="366" y="245" width="60" height="32" rx="5" fill="#D46B8A"/>
  <text x="396" y="266" fill="#FFF" font-size="10" font-weight="bold" text-anchor="middle">Rose</text>

  <rect x="440" y="245" width="4" height="32" fill="#272220"/>

  <rect x="456" y="245" width="60" height="32" rx="5" fill="#505962"/>
  <text x="486" y="266" fill="#FFF" font-size="10" font-weight="bold" text-anchor="middle">A</text>

  <rect x="524" y="245" width="60" height="32" rx="5" fill="#454D55"/>
  <text x="554" y="266" fill="#FFF" font-size="10" font-weight="bold" text-anchor="middle">B</text>

  <rect x="592" y="245" width="60" height="32" rx="5" fill="#606870"/>
  <text x="622" y="266" fill="#FFF" font-size="10" font-weight="bold" text-anchor="middle">C</text>

  <rect x="660" y="245" width="60" height="32" rx="5" fill="#3D444B"/>
  <text x="690" y="266" fill="#FFF" font-size="10" font-weight="bold" text-anchor="middle">D</text>
</svg>
