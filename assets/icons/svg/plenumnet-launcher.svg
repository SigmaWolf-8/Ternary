<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#181411;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F0C0A;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="128" cy="128" r="120" fill="url(#bg-grad)" stroke="#272220" stroke-width="2"/>
  <!-- PlenumNET "P" lattice mark -->
  <g transform="translate(60, 40)" fill="none" stroke="#F0EDE8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Vertical stem -->
    <line x1="30" y1="20" x2="30" y2="170"/>
    <!-- Top arc / bowl -->
    <path d="M 30 20 L 90 20 Q 120 20 120 55 Q 120 90 90 90 L 30 90"/>
    <!-- Lattice crosshatch detail -->
    <line x1="50" y1="20" x2="50" y2="90" stroke-width="3" opacity="0.5"/>
    <line x1="70" y1="20" x2="70" y2="90" stroke-width="3" opacity="0.5"/>
    <line x1="30" y1="40" x2="120" y2="40" stroke-width="3" opacity="0.5"/>
    <line x1="30" y1="65" x2="120" y2="65" stroke-width="3" opacity="0.5"/>
  </g>
  <!-- Accent dot -->
  <circle cx="188" cy="200" r="12" fill="#4A9EF5"/>
</svg>
