<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="cube-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#181411;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F0C0A;stop-opacity:1" />
    </linearGradient>
  </defs>
  <circle cx="128" cy="128" r="120" fill="url(#cube-grad)" stroke="#272220" stroke-width="2"/>
  <!-- Interlocking cubes motif -->
  <g transform="translate(55, 55)" fill="none" stroke="#F0EDE8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Front cube -->
    <polygon points="30,60 75,35 120,60 75,85" fill="none"/>
    <polygon points="30,60 30,110 75,135 75,85" fill="none"/>
    <polygon points="75,85 75,135 120,110 120,60" fill="none"/>
    <!-- Back cube (offset) -->
    <polygon points="55,30 100,5 145,30 100,55" fill="none" opacity="0.6"/>
    <polygon points="55,30 55,80 100,105 100,55" fill="none" opacity="0.6"/>
    <polygon points="100,55 100,105 145,80 145,30" fill="none" opacity="0.6"/>
    <!-- Connection lines between cubes -->
    <line x1="75" y1="60" x2="100" y2="30" stroke="#4A9EF5" stroke-width="3" opacity="0.8"/>
  </g>
  <circle cx="195" cy="195" r="10" fill="#4A9EF5"/>
</svg>
