[package]
name = "sponge-napi"
version = "0.1.0"
edition = "2021"
license = "LicenseRef-Proprietary"
authors = ["Salvi — Capomastro Holdings Ltd."]

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", features = ["napi8"] }
napi-derive = "2"
hex = "0.4"

[dependencies.ternary-math]
path = ".."

[build-dependencies]
napi-build = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
