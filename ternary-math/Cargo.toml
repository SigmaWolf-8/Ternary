[package]
name = "ternary-math"
version = "0.1.0"
edition = "2021"
description = "Mathematical foundations for the Salvi Framework ternary computing platform"
license = "LicenseRef-Proprietary"
authors = ["Salvi — Capomastro Holdings Ltd."]
repository = "https://github.com/SigmaWolf-8/Ternary"

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
wasm-bindgen = "0.2"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "tis27_bench"
harness = false
