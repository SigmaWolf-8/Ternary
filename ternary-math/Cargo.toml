[package]
name = "ternary-math"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "Mathematical foundations for the Salvi Framework ternary computing platform"
license = "LicenseRef-Proprietary"
authors = ["Salvi — Capomastro Holdings Ltd."]
repository = "https://github.com/SigmaWolf-8/Ternary"

[lib]
crate-type = ["lib", "cdylib"]

[features]
default = ["parallel"]
# parallel enables rayon for native targets only.
# WASM builds MUST use --no-default-features (see Makefile).
parallel = ["rayon"]
# serde enables Serialize/Deserialize on TritInt and Trit.
# WASM-compatible: cargo build --target wasm32-unknown-unknown --no-default-features --features serde
serde = ["dep:serde"]

[dependencies]
wasm-bindgen = "=0.2.114"
libm = "=0.2.16"
rayon = { version = "=1.10.0", optional = true }
zeroize = "=1.8.1"
flate2 = "1"
serde = { version = "1", optional = true }
# Single canonical pure-ternary engine. Re-exported from `lib.rs` as
# `pub use … as aasc;` so downstream consumers (`plenumlan`, the kernel,
# bare-metal) reach `aasc` through the existing `ternary-math` import
# path while the per-module shim rewrites land. (Task #158 I-48 anchor.)
algeometric-arc-sigma182-calculi = { path = "../algeometric-arc-sigma182-calculi", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "=0.2.17"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "=0.2.17", features = ["js"] }

# Benchmark comparison only — NOT used in production paths.
# These are explicitly banned primitives. Confined to [dev-dependencies]
# and do not enter the cdylib or lib output.
[dev-dependencies]
criterion = { version = "=0.5.1", features = ["html_reports"] }
serde_json = "1"
rsa = "=0.9.10"
sha2 = "=0.10.9"
aes-gcm = "=0.10.3"

[[bench]]
name = "inter_cube"
harness = false

[[bench]]
name = "ttc_benchmark"
harness = false

[[bench]]
name = "crypto_benchmarks"
harness = false

[[bench]]
name = "trit_benchmarks"
harness = false

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
