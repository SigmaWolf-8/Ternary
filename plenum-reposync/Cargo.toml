[package]
name = "plenum-reposync"
version = "1.0.0"
edition = "2021"
description = "PlenumNET RepoSync — single-click local repository sync client"
license = "Proprietary"
publish = false

[dependencies]
plenumnet-kernel = { path = "../src/kernel", default-features = false, features = ["std"] }
toml = "0.8"
serde = { version = "1", features = ["derive"] }
anyhow = "1"
dirs = "5"

[[bin]]
name = "plenum-reposync"
path = "src/main.rs"
