[package]
name = "plenumnet-kernel"
version = "0.1.0"
edition = "2021"
authors = ["Capomastro Holdings Ltd <kernel@plenumnet.io>"]
description = "PlenumNET Salvi Framework Kernel - Post-Quantum Ternary Computing Core"
license = "LicenseRef-Proprietary"
repository = "https://github.com/SigmaWolf-8/Ternary"
documentation = "https://docs.plenumnet.io/kernel"
readme = "README.md"
keywords = ["ternary", "post-quantum", "cryptography", "kernel", "femtosecond"]
categories = ["cryptography", "embedded", "no-std"]
rust-version = "1.77"

[lib]
name = "plenumnet_kernel"
path = "src/lib.rs"

[features]
default = ["std"]
std = []
no_std = []
fpga = ["no_std"]
asic = ["no_std"]
finra-613 = []
bench-tools = ["nalgebra", "rand"]
browser-crates = ["plenum-std", "html5ever", "cssparser", "taffy", "rustybuzz", "fontdue", "boa_engine", "tiny-skia", "resvg"]

[dependencies]
spin = { version = "0.9", default-features = false }
lazy_static = { version = "1.4", features = ["spin_no_std"] }
libm = "0.2"
hashbrown = { version = "0.14", default-features = false, features = ["ahash"] }
plenum-std = { path = "../plenum-std", optional = true }
# Single canonical pure-ternary engine. Default features disabled to keep
# the kernel `no_std`-clean. The kernel `ternary` module re-exports aasc
# symbols (`Trit`, `TritVec`, `Representation`) so downstream consumers —
# including the bare-metal target via the `no_std` feature — can migrate
# off the kernel-local types onto the canonical engine. (Task #158 I-47.)
algeometric-arc-sigma182-calculi = { path = "../../algeometric-arc-sigma182-calculi", default-features = false }

[dependencies.html5ever]
version = "0.27"
optional = true

[dependencies.cssparser]
version = "0.33"
optional = true

[dependencies.taffy]
version = "0.5"
default-features = false
optional = true

[dependencies.rustybuzz]
version = "0.14"
default-features = false
optional = true

[dependencies.fontdue]
version = "0.9"
default-features = false
optional = true

[dependencies.boa_engine]
version = "0.21"
default-features = false
optional = true

[dependencies.tiny-skia]
version = "0.11"
default-features = false
features = ["no-std-float"]
optional = true

[dependencies.resvg]
version = "0.47"
default-features = false
optional = true

[dependencies.nalgebra]
version = "0.33"
optional = true

[dependencies.rand]
version = "0.8"
optional = true

[dev-dependencies]
proptest = { version = "=1.4.0", default-features = false, features = ["std"] }
nalgebra = "0.33"
rand = "0.8"
criterion = { version = "0.5", features = ["html_reports"] }

[[bin]]
name = "plenumnet-kernel"
path = "src/main.rs"
required-features = ["no_std"]

[[bin]]
name = "salvi-bench"
path = "benchmarks/salvi_benchmarks.rs"

[[bin]]
name = "timing-breakdown"
path = "benchmarks/timing_breakdown.rs"
required-features = ["bench-tools"]

[[bin]]
name = "qutrit-ft-bench"
path = "benchmarks/qutrit_ft_benchmark.rs"
required-features = ["bench-tools"]

[[bin]]
name = "qudit-ft-bench"
path = "benchmarks/qudit_ft_benchmark.rs"
required-features = ["bench-tools"]

[[bench]]
name = "salvi_benchmarks"
harness = false

[[bench]]
name = "sponge_bench"
harness = false

[[bench]]
name = "tldsa_bench"
harness = false
