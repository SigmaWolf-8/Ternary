[package]
name = "plenumnet-kernel"
version = "0.1.0"
edition = "2021"
authors = ["Capomastro Holdings Ltd <kernel@plenumnet.io>"]
description = "PlenumNET Salvi Framework Kernel - Post-Quantum Ternary Computing Core"
license = "LicenseRef-Proprietary"
repository = "https://github.com/SigmaWolf-8/Ternary"
documentation = "https://docs.plenumnet.io/kernel"
readme = "README.md"
keywords = ["ternary", "post-quantum", "cryptography", "kernel", "femtosecond"]
categories = ["cryptography", "embedded", "no-std"]
rust-version = "1.77"

[lib]
name = "plenumnet_kernel"
path = "src/lib.rs"

[features]
default = ["std"]
std = []
no_std = []
fpga = ["no_std"]
asic = ["no_std"]
finra-613 = []
bench-tools = ["nalgebra", "rand"]

[dependencies]
spin = { version = "0.9", default-features = false }
lazy_static = { version = "1.4", features = ["spin_no_std"] }
libm = "0.2"

[dependencies.nalgebra]
version = "0.33"
optional = true

[dependencies.rand]
version = "0.8"
optional = true

[dev-dependencies]
proptest = { version = "=1.4.0", default-features = false, features = ["std"] }
nalgebra = "0.33"
rand = "0.8"
criterion = { version = "0.5", features = ["html_reports"] }

[[bin]]
name = "salvi-bench"
path = "benchmarks/salvi_benchmarks.rs"

[[bin]]
name = "timing-breakdown"
path = "benchmarks/timing_breakdown.rs"
required-features = ["bench-tools"]

[[bin]]
name = "qutrit-ft-bench"
path = "benchmarks/qutrit_ft_benchmark.rs"
required-features = ["bench-tools"]

[[bin]]
name = "qudit-ft-bench"
path = "benchmarks/qudit_ft_benchmark.rs"
required-features = ["bench-tools"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[[bench]]
name = "salvi_benchmarks"
harness = false

[[bench]]
name = "sponge_bench"
harness = false

[[bench]]
name = "tldsa_bench"
harness = false

[profile.bench]
opt-level = 3
debug = false
