<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 920" width="800" height="920" font-family="system-ui, -apple-system, sans-serif">
  <rect width="800" height="920" fill="#0F0C0A"/>

  <text x="30" y="42" fill="#ECE8DF" font-size="24" font-weight="bold">PlenumNET Brand Colors</text>
  <text x="30" y="64" fill="#8A8173" font-size="13">Capomastro Holdings Ltd.</text>

  <!-- BACKGROUNDS -->
  <text x="30" y="105" fill="#4A9EF5" font-size="11" font-weight="bold" letter-spacing="2">BACKGROUNDS</text>

  <rect x="30" y="118" width="48" height="48" fill="#0F0C0A" stroke="#555" stroke-width="1"/>
  <text x="92" y="138" fill="#ECE8DF" font-size="14" font-weight="bold">Page Background</text>
  <text x="92" y="156" fill="#8A8173" font-size="13" font-family="monospace">#0F0C0A  —  hsl(20, 14%, 4%)</text>

  <rect x="30" y="174" width="48" height="48" fill="#181411" stroke="#555" stroke-width="1"/>
  <text x="92" y="194" fill="#ECE8DF" font-size="14" font-weight="bold">Card / Panel</text>
  <text x="92" y="212" fill="#8A8173" font-size="13" font-family="monospace">#181411  —  hsl(20, 14%, 8%)</text>

  <rect x="30" y="230" width="48" height="48" fill="#1D1915" stroke="#555" stroke-width="1"/>
  <text x="92" y="250" fill="#ECE8DF" font-size="14" font-weight="bold">Muted Surface</text>
  <text x="92" y="268" fill="#8A8173" font-size="13" font-family="monospace">#1D1915  —  hsl(20, 12%, 10%)</text>

  <rect x="30" y="286" width="48" height="48" fill="#272220" stroke="#555" stroke-width="1"/>
  <text x="92" y="306" fill="#ECE8DF" font-size="14" font-weight="bold">Border</text>
  <text x="92" y="324" fill="#8A8173" font-size="13" font-family="monospace">#272220  —  hsl(20, 10%, 14%)</text>

  <!-- TEXT -->
  <text x="30" y="365" fill="#4A9EF5" font-size="11" font-weight="bold" letter-spacing="2">TEXT</text>

  <rect x="30" y="378" width="48" height="48" fill="#ECE8DF" stroke="#555" stroke-width="1"/>
  <text x="92" y="398" fill="#ECE8DF" font-size="14" font-weight="bold">Headings</text>
  <text x="92" y="416" fill="#8A8173" font-size="13" font-family="monospace">#ECE8DF  —  hsl(45, 25%, 91%)</text>

  <rect x="30" y="434" width="48" height="48" fill="#E4DFD5" stroke="#555" stroke-width="1"/>
  <text x="92" y="454" fill="#ECE8DF" font-size="14" font-weight="bold">Nav Text</text>
  <text x="92" y="472" fill="#8A8173" font-size="13" font-family="monospace">#E4DFD5</text>

  <rect x="30" y="490" width="48" height="48" fill="#BCB3A3" stroke="#555" stroke-width="1"/>
  <text x="92" y="510" fill="#ECE8DF" font-size="14" font-weight="bold">Body Text</text>
  <text x="92" y="528" fill="#8A8173" font-size="13" font-family="monospace">#BCB3A3  —  hsl(40, 15%, 70%)</text>

  <rect x="30" y="546" width="48" height="48" fill="#8A8173" stroke="#555" stroke-width="1"/>
  <text x="92" y="566" fill="#ECE8DF" font-size="14" font-weight="bold">Labels / Captions</text>
  <text x="92" y="584" fill="#8A8173" font-size="13" font-family="monospace">#8A8173  —  hsl(35, 10%, 50%)</text>

  <rect x="30" y="602" width="48" height="48" fill="#5E5851" stroke="#555" stroke-width="1"/>
  <text x="92" y="622" fill="#ECE8DF" font-size="14" font-weight="bold">Faint / Decorative</text>
  <text x="92" y="640" fill="#8A8173" font-size="13" font-family="monospace">#5E5851  —  hsl(30, 8%, 35%)</text>

  <!-- ACCENT -->
  <text x="30" y="681" fill="#4A9EF5" font-size="11" font-weight="bold" letter-spacing="2">ACCENT</text>

  <rect x="30" y="694" width="48" height="48" fill="#4A9EF5" stroke="#555" stroke-width="1" rx="4"/>
  <text x="92" y="714" fill="#ECE8DF" font-size="14" font-weight="bold">Primary Blue</text>
  <text x="92" y="732" fill="#8A8173" font-size="13" font-family="monospace">#4A9EF5  —  hsl(210, 80%, 55%)</text>

  <rect x="30" y="750" width="48" height="48" fill="#38BDF8" stroke="#555" stroke-width="1" rx="4"/>
  <text x="92" y="770" fill="#ECE8DF" font-size="14" font-weight="bold">Nav Hover Blue</text>
  <text x="92" y="788" fill="#8A8173" font-size="13" font-family="monospace">#38BDF8</text>

  <rect x="30" y="806" width="48" height="48" fill="#A87FD4" stroke="#555" stroke-width="1" rx="4"/>
  <text x="92" y="826" fill="#ECE8DF" font-size="14" font-weight="bold">Purple</text>
  <text x="92" y="844" fill="#8A8173" font-size="13" font-family="monospace">#A87FD4  —  hsl(270, 50%, 65%)</text>

  <rect x="30" y="862" width="48" height="48" fill="#40BF6E" stroke="#555" stroke-width="1" rx="4"/>
  <text x="92" y="882" fill="#ECE8DF" font-size="14" font-weight="bold">Green</text>
  <text x="92" y="900" fill="#8A8173" font-size="13" font-family="monospace">#40BF6E  —  hsl(145, 50%, 50%)</text>
</svg>
