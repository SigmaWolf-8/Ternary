[package]
name = "pty-mux"
version = "0.2.0"
edition = "2021"
authors = ["RSalvi@Salvigroup.com"]
description = "PTY multiplexer service for PlenumNET Node Terminal — real PTY spawning with WebSocket I/O"
license = "UNLICENSED"

[dependencies]
tokio = { version = "1", features = ["full"] }
portable-pty = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
tokio-tungstenite = "0.21"
