<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 380px;
    font-family: 'Segoe UI', -apple-system, sans-serif;
    background: #090807;
    color: #E4DFD5;
    font-size: 13px;
  }
  .header {
    background: linear-gradient(135deg, #0D0C0B 0%, #1A1816 100%);
    padding: 16px 20px;
    border-bottom: 1px solid #2A2520;
  }
  .header h1 {
    font-size: 15px;
    font-weight: 600;
    color: #D4A017;
    letter-spacing: 0.5px;
  }
  .header .subtitle {
    font-size: 11px;
    color: #8A8578;
    margin-top: 2px;
  }
  .status-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 20px;
    background: #0F0E0D;
    border-bottom: 1px solid #1A1816;
    font-size: 11px;
  }
  .status-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #059669;
  }
  .status-dot.offline { background: #DC2626; }
  .status-text { color: #8A8578; }
  .search-area {
    padding: 16px 20px;
  }
  .search-row {
    display: flex;
    gap: 8px;
  }
  .search-input {
    flex: 1;
    background: #1A1816;
    border: 1px solid #2A2520;
    color: #E4DFD5;
    padding: 10px 14px;
    border-radius: 6px;
    font-size: 14px;
    outline: none;
    font-family: 'Consolas', 'Menlo', monospace;
  }
  .search-input:focus { border-color: #D4A017; }
  .search-input::placeholder { color: #5A5548; }
  .btn {
    background: #D4A017;
    color: #090807;
    border: none;
    padding: 10px 16px;
    border-radius: 6px;
    font-weight: 600;
    font-size: 12px;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn:hover { background: #E8B42E; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .result {
    padding: 0 20px 16px;
    display: none;
  }
  .result.show { display: block; }
  .address-box {
    background: #1A1816;
    border: 1px solid #2A2520;
    border-radius: 6px;
    padding: 12px 14px;
    font-family: 'Consolas', 'Menlo', monospace;
    font-size: 12px;
    color: #D4A017;
    word-break: break-all;
    margin-bottom: 8px;
  }
  .crd-badge {
    display: inline-block;
    background: #059669;
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 10px;
    margin-left: 4px;
  }
  .meta-row {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: #8A8578;
    padding: 4px 0;
  }
  .error-msg {
    color: #DC2626;
    font-size: 12px;
    padding: 8px 0;
    display: none;
  }
  .error-msg.show { display: block; }
  .open-full {
    display: block;
    text-align: center;
    color: #D4A017;
    font-size: 11px;
    padding: 10px 0;
    border-top: 1px solid #1A1816;
    text-decoration: none;
    cursor: pointer;
  }
  .open-full:hover { color: #E8B42E; }
  .footer {
    padding: 10px 20px;
    border-top: 1px solid #1A1816;
    font-size: 10px;
    color: #5A5548;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="header">
    <h1>PlenumNET TDNS</h1>
    <div class="subtitle">Ternary Domain Name System v2.3.2</div>
  </div>

  <div class="status-bar">
    <div class="status-dot" id="statusDot"></div>
    <span class="status-text" id="statusText">Checking...</span>
  </div>

  <div class="search-area">
    <div class="search-row">
      <input type="text" class="search-input" id="nameInput"
             placeholder="google.plm" autocomplete="off"
             spellcheck="false">
      <button class="btn" id="resolveBtn">Resolve</button>
    </div>
    <div class="error-msg" id="errorMsg"></div>
  </div>

  <div class="result" id="result">
    <div class="address-box" id="addressBox"></div>
    <div class="meta-row">
      <span>Scan hash</span>
      <span id="scanHash" style="font-family:monospace;font-size:10px;"></span>
    </div>
    <div class="meta-row">
      <span>HPTP mandatory</span>
      <span id="hptpStatus"></span>
    </div>
    <a class="open-full" id="openFull">Open Full Resolution →</a>
  </div>

  <div class="footer">
    Capomastro Holdings Ltd. — Applied Physics Division
  </div>

<script>
  const nameInput = document.getElementById('nameInput');
  const resolveBtn = document.getElementById('resolveBtn');
  const result = document.getElementById('result');
  const addressBox = document.getElementById('addressBox');
  const scanHash = document.getElementById('scanHash');
  const hptpStatus = document.getElementById('hptpStatus');
  const errorMsg = document.getElementById('errorMsg');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const openFull = document.getElementById('openFull');

  // Check TDNS server health
  browser.runtime.sendMessage({ type: 'health' }, (resp) => {
    if (resp && resp.ok) {
      statusDot.classList.remove('offline');
      const v = resp.data.version || '?';
      const n = resp.data.entities || 0;
      statusText.textContent = `Connected — v${v} — ${n} entities`;
    } else {
      statusDot.classList.add('offline');
      statusText.textContent = 'TDNS server offline — start Docker container';
    }
  });

  function doResolve() {
    let name = nameInput.value.trim();
    if (!name) return;
    if (!name.endsWith('.plm')) name += '.plm';

    resolveBtn.disabled = true;
    errorMsg.classList.remove('show');
    result.classList.remove('show');

    browser.runtime.sendMessage({ type: 'resolve', name }, (resp) => {
      resolveBtn.disabled = false;

      if (resp && resp.ok && resp.data.status === 'ok') {
        const d = resp.data;
        const crd = d.crd || 1;
        addressBox.innerHTML = `${d.address} <span class="crd-badge">CRD:${crd}</span>`;
        scanHash.textContent = (d.scan_hash || '').substring(0, 16) + '...';
        hptpStatus.textContent = d.hptp_mandatory ? 'Yes' : 'No';
        openFull.onclick = () => {
          browser.tabs.create({
            url: browser.runtime.getURL(`resolve.html?name=${encodeURIComponent(name)}`)
          });
        };
        result.classList.add('show');
      } else {
        errorMsg.textContent = `${name} not registered. Use the API to register it first.`;
        errorMsg.classList.add('show');
      }
    });
  }

  resolveBtn.addEventListener('click', doResolve);
  nameInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') doResolve();
  });

  nameInput.focus();
</script>
</body>
</html>
