[package]
name = "tdns-v2"
version = "2.3.0"
edition = "2024"
rust-version = "1.85"
description = "Ternary Domain Name System v2.3 — 27-Dimensional Ontological Addressing"
authors = ["Capomastro Holdings Ltd."]

[dependencies]
blake3 = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
ureq = "2"

[[bin]]
name = "tdns-scan"
path = "src/bin/tdns_scan.rs"
