[package]
name = "tdns-v2"
version = "2.3.3"
edition = "2021"
description = "Ternary Domain Name System v2.3 — 27-Dimensional Ontological Addressing"
authors = ["Capomastro Holdings Ltd."]

[features]
default = []
network-tests = []  # Gate tests that make real DNS/HTTP calls

[dependencies]
ternary-math = { path = "../../ternary-math" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
ureq = "=2.7.1"
rusqlite = { version = "0.31", features = ["bundled"] }

[[bin]]
name = "tdns-scan"
path = "src/bin/tdns_scan.rs"

[[bin]]
name = "tdns-server"
path = "src/bin/tdns_server.rs"
