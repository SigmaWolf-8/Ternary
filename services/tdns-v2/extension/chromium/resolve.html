<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>TDNS Full Resolution</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', -apple-system, sans-serif;
    background: #090807;
    color: #E4DFD5;
    font-size: 14px;
    padding: 40px;
    max-width: 800px;
    margin: 0 auto;
  }
  .header {
    border-bottom: 1px solid #2A2520;
    padding-bottom: 16px;
    margin-bottom: 24px;
  }
  .header h1 {
    font-size: 20px;
    font-weight: 600;
    color: #D4A017;
    letter-spacing: 0.5px;
  }
  .header .subtitle {
    font-size: 12px;
    color: #8A8578;
    margin-top: 4px;
  }
  .loading {
    color: #8A8578;
    font-size: 13px;
    padding: 20px 0;
  }
  .error {
    color: #DC2626;
    font-size: 13px;
    padding: 20px 0;
  }
  .section {
    margin-bottom: 24px;
  }
  .section-title {
    font-size: 11px;
    font-weight: 700;
    color: #5A5548;
    letter-spacing: 0.1em;
    margin-bottom: 10px;
    text-transform: uppercase;
  }
  .address-box {
    background: #1A1816;
    border: 1px solid #2A2520;
    border-radius: 6px;
    padding: 16px;
    font-family: 'Consolas', 'Menlo', monospace;
    font-size: 14px;
    color: #D4A017;
    word-break: break-all;
    line-height: 1.8;
  }
  .crd-badge {
    display: inline-block;
    background: #059669;
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 10px;
    border-radius: 10px;
    margin-left: 6px;
  }
  .meta-grid {
    display: grid;
    grid-template-columns: 160px 1fr;
    gap: 6px 16px;
    font-size: 13px;
  }
  .meta-label { color: #5A5548; }
  .meta-value { color: #E4DFD5; font-family: 'Consolas', monospace; font-size: 12px; }
  .dim-table {
    width: 100%;
    border-collapse: collapse;
  }
  .dim-table th {
    text-align: left;
    font-size: 10px;
    font-weight: 700;
    color: #5A5548;
    letter-spacing: 0.06em;
    padding: 6px 8px;
    border-bottom: 1px solid #2A2520;
  }
  .dim-table td {
    padding: 5px 8px;
    font-size: 12px;
    border-bottom: 1px solid #1A1816;
  }
  .dim-trit {
    font-family: 'Consolas', monospace;
    font-weight: bold;
    font-size: 14px;
    text-align: center;
    width: 30px;
  }
  .cat-who { color: #D4A017; }
  .cat-what { color: #059669; }
  .cat-where { color: #818CF8; }
  .cat-when { color: #F87171; }
  .cat-why { color: #C084FC; }
  .cat-how { color: #38BDF8; }
  .cat-peace { color: #4ADE80; }
  .footer {
    margin-top: 40px;
    padding-top: 16px;
    border-top: 1px solid #1A1816;
    font-size: 11px;
    color: #5A5548;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="header">
    <h1>PlenumNET TDNS — Full Resolution</h1>
    <div class="subtitle" id="queryName">Loading...</div>
  </div>
  <div id="content">
    <div class="loading" id="loadingMsg">Resolving...</div>
    <div class="error" id="errorMsg" style="display:none;"></div>
  </div>
  <div class="footer">
    Capomastro Holdings Ltd. — Applied Physics Division
  </div>
<script>
  const params = new URLSearchParams(window.location.search);
  const name = params.get('name') || '';
  document.getElementById('queryName').textContent = name ? 'Query: ' + name : 'No query specified';

  const CAT_CLASSES = {
    WHO: 'cat-who', WHAT: 'cat-what', WHERE: 'cat-where',
    WHEN: 'cat-when', WHY: 'cat-why', HOW: 'cat-how', PEACE: 'cat-peace'
  };

  if (name) {
    chrome.runtime.sendMessage({ type: 'resolve', name: name }, function(resp) {
      document.getElementById('loadingMsg').style.display = 'none';

      if (!resp || !resp.ok || !resp.data || resp.data.status !== 'ok') {
        document.getElementById('errorMsg').style.display = 'block';
        document.getElementById('errorMsg').textContent = name + ' could not be resolved. It may not be registered.';
        return;
      }

      var d = resp.data;
      var html = '';

      html += '<div class="section">';
      html += '<div class="section-title">Address</div>';
      html += '<div class="address-box">' + d.address;
      if (d.crd) html += ' <span class="crd-badge">CRD:' + d.crd + '</span>';
      html += '</div></div>';

      html += '<div class="section"><div class="section-title">Metadata</div>';
      html += '<div class="meta-grid">';
      html += '<span class="meta-label">Name</span><span class="meta-value">' + (d.name || name) + '</span>';
      html += '<span class="meta-label">Scan Hash</span><span class="meta-value">' + (d.scan_hash || 'N/A') + '</span>';
      html += '<span class="meta-label">HPTP Mandatory</span><span class="meta-value">' + (d.hptp_mandatory ? 'Yes' : 'No') + '</span>';
      if (d.zone) html += '<span class="meta-label">Zone</span><span class="meta-value">' + d.zone + '</span>';
      html += '</div></div>';

      if (d.dimensions && d.dimensions.length) {
        html += '<div class="section"><div class="section-title">27 Ontological Dimensions</div>';
        html += '<table class="dim-table"><tr><th>#</th><th>Cat</th><th>Trit</th><th>Question</th><th>Value</th></tr>';
        d.dimensions.forEach(function(dim) {
          var cc = CAT_CLASSES[dim.category] || '';
          html += '<tr>';
          html += '<td style="color:#5A5548;">' + dim.number + '</td>';
          html += '<td class="' + cc + '">' + dim.category + '</td>';
          html += '<td class="dim-trit ' + cc + '">' + dim.value + '</td>';
          html += '<td>' + (dim.question || '') + '</td>';
          html += '<td class="' + cc + '">' + (dim.label || '') + '</td>';
          html += '</tr>';
        });
        html += '</table></div>';
      }

      document.getElementById('content').innerHTML = html;
    });
  } else {
    document.getElementById('loadingMsg').style.display = 'none';
    document.getElementById('errorMsg').style.display = 'block';
    document.getElementById('errorMsg').textContent = 'No name specified in URL.';
  }
</script>
</body>
</html>
