[package]
name = "pqti-service"
version = "0.1.0"
edition = "2021"
authors = ["Capomastro Holdings Ltd <kernel@plenumnet.io>"]
description = "Post-Quantum Ternary Infrastructure REST API Service"
license = "LicenseRef-Proprietary"

[[bin]]
name = "pqti-service"
path = "src/main.rs"

[dependencies]
plenumnet-kernel = { path = "../../src/kernel", default-features = true }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }
