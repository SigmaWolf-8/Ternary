#
# 27-Node Inter-Cube Deployment (TM-2026-020.2 §5.2)
# Full 26-neighbor deployment: 1 CRS + 26 neighbor cubes.
#
# Roles per TM-2026-020.2 §6:
#   inference  — YODA inference nodes (primary compute)
#   review     — verification / audit nodes
#   kb         — knowledge base / storage nodes
#   infra      — infrastructure management nodes
#   relay      — network relay / bridge nodes
#   standby    — cold standby / failover nodes
#
# Usage:
#   docker compose -f docker-compose.27-node.yml build
#   docker compose -f docker-compose.27-node.yml up -d
#   docker compose -f docker-compose.27-node.yml logs -f crs

x-cube-defaults: &cube-defaults
  build:
    context: ../..
    dockerfile: services/inter-cube/Dockerfile
  environment: &cube-env
    CUBE_MODE: cube
    CUBE_CRS_URL: http://crs:8080
    RUST_LOG: info
  networks:
    - cube-net-27
  depends_on:
    crs:
      condition: service_healthy
  restart: unless-stopped

services:
  # ── CRS Coordinator ──────────────────────────────────────────────
  crs:
    build:
      context: ../..
      dockerfile: services/inter-cube/Dockerfile
    container_name: plenum-27-crs
    environment:
      CUBE_MODE: crs
      RUST_LOG: info
    ports:
      - "8080:8080"
    networks:
      cube-net-27:
        ipv4_address: 172.29.0.10
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped

  # ── Inference Nodes (8) ──────────────────────────────────────────
  cube-inf-01:
    <<: *cube-defaults
    container_name: plenum-27-inf-01
    environment:
      <<: *cube-env
      CUBE_ENDPOINT: "cube-inf-01:51820"
      CUBE_ROLE: inference
    ports: ["8101:8080"]

  cube-inf-02:
    <<: *cube-defaults
    container_name: plenum-27-inf-02
    environment:
      <<: *cube-env
      CUBE_ENDPOINT: "cube-inf-02:51820"
