#
# 4-Node Inter-Cube Deployment
# Central CRS coordinator + 3 neighbor cubes on a bridge network.
#
# Usage:
#   docker compose build
#   docker compose up -d
#   docker compose logs -f

services:
  crs:
    build:
      context: ../..
      dockerfile: services/inter-cube/Dockerfile
    container_name: plenum-crs
    environment:
      CUBE_MODE: crs
      RUST_LOG: info
    ports:
      - "8080:8080"
      - "51820:51820/udp"
    networks:
      cube-net:
        ipv4_address: 172.28.0.10
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3

  cube-1:
    build:
      context: ../..
      dockerfile: services/inter-cube/Dockerfile
    container_name: plenum-cube-1
    environment:
      CUBE_MODE: cube
      CUBE_CRS_URL: http://crs:8080
      ADDRESS: "cube-1:51820"
      ROLE: inference
      RUST_LOG: info
    ports:
      - "8081:8080"
    networks:
      cube-net:
        ipv4_address: 172.28.0.11
    depends_on:
      crs:
        condition: service_healthy

  cube-2:
    build:
      context: ../..
      dockerfile: services/inter-cube/Dockerfile
    container_name: plenum-cube-2
    environment:
      CUBE_MODE: cube
      CUBE_CRS_URL: http://crs:8080
      ADDRESS: "cube-2:51820"
      ROLE: inference
      RUST_LOG: info
    ports:
      - "8082:8080"
    networks:
      cube-net:
        ipv4_address: 172.28.0.12
    depends_on:
      crs:
        condition: service_healthy

  cube-3:
    build:
      context: ../..
      dockerfile: services/inter-cube/Dockerfile
    container_name: plenum-cube-3
    environment:
      CUBE_MODE: cube
      CUBE_CRS_URL: http://crs:8080
      ADDRESS: "cube-3:51820"
      ROLE: relay
      RUST_LOG: info
    ports:
      - "8083:8080"
    networks:
      cube-net:
        ipv4_address: 172.28.0.13
    depends_on:
      crs:
        condition: service_healthy

networks:
  cube-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
