[package]
name = "inter-cube"
version = "2.4.0"
edition = "2021"
description = "PlenumNET Inter-Cube Infrastructure: Geometric Load Balancer, Cube Overlay Network, Registration Service, and Fault Tolerance Service"
license = "LicenseRef-Proprietary"
authors = ["Salvi — Capomastro Holdings Ltd."]
repository = "https://github.com/SigmaWolf-8/Ternary"

[dependencies]
# Use the workspace ternary-math crate for GF(3) primitives
ternary-math = { path = "../../ternary-math" }

# Async runtime for CON tunnel management, CRS coordination, FTS heartbeats
tokio = { version = "1", features = ["full"] }

# Serialization for API payloads and CRS registry persistence
serde = { version = "1", features = ["derive"] }
serde_json = "1"


# Timestamp handling for FTS, CRS heartbeats
chrono = { version = "0.4", features = ["serde"] }

# HTTP server for daemon API endpoints
axum = "0.7"

# WebSocket relay shared deps
futures-util = "0.3"
url = "2"

# Hex encoding for address persistence
hex = "0.4"

# Hostname detection for default passphrase derivation
hostname = "0.4"

# OS-level CSPRNG for master secret generation
getrandom = "0.2"

# Logging
tracing = "0.1"

# Platform-specific TLS: rustls on Linux (no C compiler), native-tls on Windows (SChannel, no C compiler)
[target.'cfg(not(windows))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-webpki-roots"] }

[target.'cfg(windows)'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }

[dev-dependencies]
tokio-test = "0.4"

[[bin]]
name = "inter-cube-daemon"
path = "src/main.rs"
