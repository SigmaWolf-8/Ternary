#
# Inter-Cube Infrastructure Services for PlenumNET
# GLB · CON · CRS · FTS
#
# Dependency Pinning Strategy:
# - All dependencies use caret version constraints (e.g., "1" = "^1.0.0").
# - Cargo.lock is committed and provides reproducible builds.
# - No external crypto dependencies — all cryptographic operations use the
#   workspace ternary-math crate (TLSponge-385, TL-DSA, TL-KEM, TIS-27).
# - `cargo audit` should be run periodically against Cargo.lock.
# - Major version bumps require manual review and testing.

[package]
name = "inter-cube"
version = "2.4.13"
edition = "2021"
description = "PlenumNET Inter-Cube Infrastructure: Geometric Load Balancer, Cube Overlay Network, Registration Service, and Fault Tolerance Service"
license = "LicenseRef-Proprietary"
authors = ["Salvi — Capomastro Holdings Ltd."]
repository = "https://github.com/SigmaWolf-8/Ternary"

[dependencies]
# Use the workspace ternary-math crate for GF(3) primitives
ternary-math = { path = "../../ternary-math" }

# PlenumLAN crate for Array3 SlotAddress, port mapping, and node config
plenumlan = { path = "../../plenumlan" }

# Constant-time comparison for API key validation (security requirement)
subtle = "2"

# PTY multiplexer for Node Terminal WebSocket sessions
pty-mux = { path = "../pty-mux" }

# Direct PTY spawning for remote terminal sessions
portable-pty = "0.8"

# Async runtime for CON tunnel management, CRS coordination, FTS heartbeats
tokio = { version = "1", features = ["full"] }

# Serialization for API payloads and CRS registry persistence
serde = { version = "1", features = ["derive"] }
serde_json = "1"


# Timestamp handling for FTS, CRS heartbeats
chrono = { version = "0.4", features = ["serde"] }

# HTTP server for daemon API endpoints
axum = "0.7"

# CORS middleware for browser-based monitor access
tower-http = { version = "0.5", features = ["cors"] }

# WebSocket relay shared deps
futures-util = "0.3"
url = "2"

# Hex encoding for address persistence
hex = "0.4"

# OS-level CSPRNG for master secret generation
getrandom = "0.2"

# Logging
tracing = "0.1"

# UUID v4 for Yoda chat session IDs (non-security-boundary identifier,
# exempt from zero-external-crypto rule — opaque label only)
uuid = { version = "1.6", features = ["v4"] }

# Platform-specific TLS: rustls on Linux (no C compiler), native-tls on Windows (SChannel, no C compiler)
[target.'cfg(not(windows))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-webpki-roots"] }
nix = { version = "0.29", features = ["signal", "process"] }

[target.'cfg(windows)'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }

[dev-dependencies]
tokio-test = "0.4"

[[bin]]
name = "inter-cube-daemon"
path = "src/main.rs"
