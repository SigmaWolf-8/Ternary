[app]
name = "InterCubeDaemon"
display_name = "Inter-Cube Daemon -- PlenumNET Network Service"
description = "Provides geometric routing and secure communication across the PlenumNET cube network"
version = "1.0.0"
publisher = "Capomastro Holdings Ltd."
publisher_url = "https://capomastro.com"
help_url = "https://plenumnet.replit.app/support"
update_url = "https://plenumnet.replit.app/api/install-msi"
binary = "inter-cube-daemon.exe"
icon = "assets/inter-cube.ico"
license = "Proprietary"
upgrade_code = "B2C3D4E5-F6A7-8901-BCDE-F12345678901"

[install]
directory = "Capomastro\\InterCubeDaemon"
data_directory = "InterCubeDaemon"
add_to_path = false
architecture = ["aarch64", "x86_64"]

[app_type]
kind = "service"
autostart = true
service_account = "NT SERVICE\\InterCubeDaemon"

[service]
instances = [
    { id = 1, port = 11124, cube_node_id = "1" },
    { id = 2, port = 11151, cube_node_id = "2" },
    { id = 3, port = 11178, cube_node_id = "3" },
]
watchdog_enabled = true
watchdog_interval_secs = 30
restart_on_failure = true
restart_delay_secs = 5
advanced_deploy_script = "deploy-yoda.ps1"

[first_run]
actions = [
    { type = "run_command",
      command = "inter-cube-daemon init --crs-endpoint {{CRS_ENDPOINT}}",
      passphrase_file = "" },
]

[shortcuts]
start_menu = [
    { name = "Inter-Cube Daemon", target = "inter-cube-daemon.exe", icon = "assets/inter-cube.ico" },
]

[uninstall]
preserve_data = true
preserve_message = "Your Inter-Cube Daemon node keypair and configuration have been preserved in %APPDATA%\\InterCubeDaemon. If you plan to reinstall, these will be automatically detected."
