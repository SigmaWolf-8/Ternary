<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 120" width="600" height="120">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2A3040"/>
      <stop offset="50%" stop-color="#1A1E28"/>
      <stop offset="100%" stop-color="#0F1118"/>
    </linearGradient>
  </defs>
  <g transform="translate(10, 10)">
    <!-- Monogram Icon -->
    <g transform="translate(0, 0)" fill="none" stroke="url(#logoGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
      <!-- Vertical axis -->
      <line x1="50" y1="5" x2="50" y2="95"/>
      <!-- Horizontal crossbar -->
      <line x1="30" y1="50" x2="70" y2="50"/>
      <!-- Upper-left diagonal -->
      <line x1="20" y1="15" x2="50" y2="50"/>
      <!-- Lower-left diagonal -->
      <line x1="20" y1="85" x2="50" y2="50"/>
      <!-- P curve - upper arc -->
      <path d="M50,15 C75,15 85,30 85,42 C85,54 75,62 55,62"/>
      <!-- Left arrow/branch strokes -->
      <line x1="5" y1="35" x2="35" y2="50"/>
      <line x1="5" y1="65" x2="35" y2="50"/>
      <!-- Ternary branch marks -->
      <line x1="15" y1="25" x2="40" y2="38"/>
      <line x1="15" y1="75" x2="40" y2="62"/>
    </g>
    <!-- Wordmark -->
    <text x="105" y="72" font-family="'Orbitron', sans-serif" font-weight="800" font-size="58" letter-spacing="0.08em" fill="url(#logoGrad)" text-rendering="geometricPrecision">
      <tspan>P</tspan><tspan font-size="52">lenumNET</tspan>
    </text>
  </g>
</svg>
