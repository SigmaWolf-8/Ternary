# =====================================================
# SECURITY PLUGINS
# =====================================================
plugins:
  # ---------------------------------------------------
  # Per-Service Rate Limiting
  # ---------------------------------------------------

  # 1. Timing API - High-frequency financial data
  - name: rate-limiting
    service: plenumnet-timing
    config:
      minute: 100
      hour: 1000
      policy: local
      fault_tolerant: true
      hide_client_headers: false
    tags:
      - security
      - rate-limit

  # 2. Calendar API - Reference data
  - name: rate-limiting
    service: plenumnet-calendars
    config:
      minute: 120
      hour: 1200
      policy: local
      fault_tolerant: true
      hide_client_headers: false
    tags:
      - security
      - rate-limit

  # 3. Ternary Engine - Compute operations
  - name: rate-limiting
    service: plenumnet-ternary
    config:
      minute: 200
      hour: 2000
      policy: local
      fault_tolerant: true
      hide_client_headers: false
    tags:
      - security
      - rate-limit

  # 4. Phase Encryption - Crypto operations
  - name: rate-limiting
    service: plenumnet-phase
    config:
      minute: 100
      hour: 1000
      policy: local
      fault_tolerant: true
      hide_client_headers: false
    tags:
      - security
      - rate-limit

  # 5. Compression Engine - Resource-intensive
  - name: rate-limiting
    service: plenumnet-compression
    config:
      minute: 50
      hour: 500
      policy: local
      fault_tolerant: true
      hide_client_headers: false
    tags:
      - security
      - rate-limit

  # 6. Kernel Crypto - Security-critical
  - name: rate-limiting
    service: plenumnet-crypto
    config:
      minute: 80
      hour: 800
      policy: local
      fault_tolerant: true
      hide_client_headers: false
    tags:
      - security
      - rate-limit
      - cnsa2

  # 7. Whitepapers - Documentation access
  - name: rate-limiting
    service: plenumnet-whitepapers
    config:
      minute: 100
      hour: 1000
      policy: local
      fault_tolerant: true
      hide_client_headers: false
    tags:
      - security
      - rate-limit

  # 8. API Docs - High-frequency developer access
  - name: rate-limiting
    service: plenumnet-docs
    config:
      minute: 200
      hour: 2000
      policy: local
      fault_tolerant: true
      hide_client_headers: false
    tags:
      - security
      - rate-limit

  # 9. Authentication - Login flow
  - name: rate-limiting
    service: plenumnet-auth
    config:
      minute: 30
      hour: 300
      policy: local
      fault_tolerant: true
      hide_client_headers: false
    tags:
      - security
      - rate-limit
      - auth

  # 10. User API - Profile access
  - name: rate-limiting
    service: plenumnet-user
    config:
      minute: 100
      hour: 1000
      policy: local
      fault_tolerant: true
      hide_client_headers: false
    tags:
      - security
      - rate-limit

  # 11. Developer Signup - Controlled intake
  - name: rate-limiting
    service: plenumnet-developer-signup
    config:
      minute: 20
      hour: 200
      policy: local
      fault_tolerant: true
      hide_client_headers: false
    tags:
      - security
      - rate-limit

  # 12. Admin Dashboard - Restricted access
  - name: rate-limiting
    service: plenumnet-admin
    config:
      minute: 60
      hour: 600
      policy: local
      fault_tolerant: true
      hide_client_headers: false
    tags:
      - security
      - rate-limit
      - admin

  # 13. GitHub Integration - Admin operations
  - name: rate-limiting
    service: plenumnet-github
    config:
      minute: 60
      hour: 600
      policy: local
      fault_tolerant: true
      hide_client_headers: false
    tags:
      - security
      - rate-limit
      - admin

  # 14. Kong Gateway - Gateway management
  - name: rate-limiting
    service: plenumnet-kong
    config:
      minute: 60
      hour: 600
      policy: local
      fault_tolerant: true
      hide_client_headers: false
    tags:
      - security
      - rate-limit
      - admin

  # 15. Certification - Audit operations
  - name: rate-limiting
    service: plenumnet-certification
    config:
      minute: 50
      hour: 500
      policy: local
      fault_tolerant: true
      hide_client_headers: false
    tags:
      - security
      - rate-limit
      - compliance

  # 16. Payments - Financial transactions
  - name: rate-limiting
    service: plenumnet-payments
    config:
      minute: 30
      hour: 300
      policy: local
      fault_tolerant: true
      hide_client_headers: false
    tags:
      - security
      - rate-limit
      - financial

  # 17. Blockchain - Witnessing operations
  - name: rate-limiting
    service: plenumnet-blockchain
    config:
      minute: 40
      hour: 400
      policy: local
      fault_tolerant: true
      hide_client_headers: false
    tags:
      - security
      - rate-limit
      - blockchain

  # 18. Health - Monitoring
  - name: rate-limiting
    service: plenumnet-health
    config:
      minute: 300
      hour: 3000
      policy: local
      fault_tolerant: true
      hide_client_headers: false
    tags:
      - security
      - rate-limit
      - monitoring

  # 19. PQTI Signing - Cryptographic operations (security-critical)
  - name: rate-limiting
    service: plenumnet-signing
    config:
      minute: 60
      hour: 600
      policy: local
      fault_tolerant: true
      hide_client_headers: false
    tags:
      - security
      - rate-limit
      - post-quantum
      - cnsa2

  # ---------------------------------------------------
  # Request Size Limiting
  # ---------------------------------------------------
  - name: request-size-limiting
    service: plenumnet-compression
    config:
      allowed_payload_size: 10
      size_unit: megabytes
    tags:
      - security

  - name: request-size-limiting
    service: plenumnet-payments
    config:
      allowed_payload_size: 1
      size_unit: megabytes
    tags:
      - security
      - financial

  # ---------------------------------------------------
  # Global Plugins (applied to all services)
  # ---------------------------------------------------

  # Correlation ID - For distributed tracing
  - name: correlation-id
    config:
      header_name: X-PlenumNET-Request-ID
      generator: uuid
      echo_downstream: true
    tags:
      - observability

  # Response Rate Limiting Headers
  - name: response-ratelimiting
    service: plenumnet-timing
    config:
      header_name: X-PlenumNET-RateLimit
      limits:
        timing:
          minute: 100
    tags:
      - security

  # ---------------------------------------------------
  # CNSA 2.0 Compliance Enforcement (Global)
  # ---------------------------------------------------

  # CNSA 2.0 TLS Enforcement - Restrict to quantum-resistant algorithms
  - name: request-transformer
    config:
      add:
        headers:
          - "X-CNSA2-Enforced: true"
          - "X-CNSA2-Policy: cnsa-only"
          - "X-CNSA2-KEX: ML-KEM-1024"
          - "X-CNSA2-Auth: ML-DSA-87,XMSS,LMS"
          - "X-CNSA2-Cipher: AES-256-GCM"
          - "X-CNSA2-Hash: SHA-384,SHA-512"
    tags:
      - security
      - cnsa2
      - quantum-safe

  # CNSA 2.0 Response Headers - Advertise compliance
  - name: response-transformer
    config:
      add:
        headers:
          - "X-CNSA2-Compliance: full"
          - "X-CNSA2-Algorithms: 11/11"
          - "X-CNSA2-Standards: FIPS-203,FIPS-204,SP-800-208"
          - "X-Quantum-Safe: true"
          - "Strict-Transport-Security: max-age=63072000; includeSubDomains; preload"
    tags:
      - security
      - cnsa2
      - compliance

  # Block non-CNSA cipher negotiation on crypto endpoints
  - name: request-termination
    service: plenumnet-crypto
    config:
      status_code: 403
      message: "CNSA 2.0 policy violation: only quantum-resistant algorithms permitted"
    enabled: false
    tags:
      - security
      - cnsa2
      - enforcement

# =====================================================
# API CONSUMERS
# =====================================================
consumers:
  - username: ai-agent-default
    tags:
      - ai-agent
      - default
    keyauth_credentials:
      - key: plenumnet-ai-agent-key

  - username: ai-agent-premium
    tags:
      - ai-agent
      - premium
    keyauth_credentials:
      - key: plenumnet-ai-premium-key

  - username: financial-partner
    tags:
      - financial
      - partner
    keyauth_credentials:
      - key: plenumnet-financial-partner-key

  - username: blockchain-service
    tags:
      - blockchain
      - service
    keyauth_credentials:
      - key: plenumnet-blockchain-service-key

# =====================================================
# UPSTREAMS (Load Balancing)
# =====================================================
upstreams:
  - name: plenumnet-timing-upstream
    algorithm: round-robin
    healthchecks:
      active:
        healthy:
          interval: 30
          successes: 2
        unhealthy:
          interval: 5
          http_failures: 3
    targets:
      - target: plenumnet.replit.app:443
        weight: 100

  - name: plenumnet-crypto-upstream
    algorithm: round-robin
    healthchecks:
      active:
        healthy:
          interval: 30
          successes: 2
        unhealthy:
          interval: 5
          http_failures: 3
    targets:
      - target: plenumnet.replit.app:443
        weight: 100

  - name: plenumnet-payments-upstream
    algorithm: round-robin
    healthchecks:
      active:
        healthy:
          interval: 15
          successes: 2
        unhealthy:
          interval: 5
          http_failures: 2
    targets:
      - target: plenumnet.replit.app:443
        weight: 100
