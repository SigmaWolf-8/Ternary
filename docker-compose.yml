services:
  crs:
    build: .
    environment:
      CUBE_MODE: crs
      CUBE_LOG_LEVEL: info
      RUST_LOG: info
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  cube-1:
    build: .
    environment:
      CUBE_MODE: cube
      CUBE_CRS_URL: http://crs:8080
      CUBE_ENDPOINT: cube-1:51820
      CUBE_LOG_LEVEL: info
      RUST_LOG: info
    depends_on:
      crs:
        condition: service_healthy

  cube-2:
    build: .
    environment:
      CUBE_MODE: cube
      CUBE_CRS_URL: http://crs:8080
      CUBE_ENDPOINT: cube-2:51820
      CUBE_LOG_LEVEL: info
      RUST_LOG: info
    depends_on:
      crs:
        condition: service_healthy

  cube-3:
    build: .
    environment:
      CUBE_MODE: cube
      CUBE_CRS_URL: http://crs:8080
      CUBE_ENDPOINT: cube-3:51820
      CUBE_LOG_LEVEL: info
      RUST_LOG: info
    depends_on:
      crs:
        condition: service_healthy
