<script>
  const container = document.getElementById('svg-container');
  const zoomInfo = document.getElementById('zoom-level');
  let scale = 1;

  const svg = container.querySelector('svg');
  svg.style.transformOrigin = '0 0';
  updateTransform();

  container.addEventListener('wheel', (e) => {
    e.preventDefault();
    const zoomSpeed = 0.1;
    scale += e.deltaY > 0 ? -zoomSpeed : zoomSpeed;
    scale = Math.min(Math.max(0.2, scale), 5);
    updateTransform();
  });

  function updateTransform() {
    svg.style.transform = `scale(${scale})`;
    zoomInfo.textContent = `Zoom: ${Math.round(scale * 100)}%`;
    svg.style.width = (4500 * scale) + 'px';
    svg.style.height = (4950 * scale) + 'px';
  }

  function resetZoom() {
    scale = 1;
    updateTransform();
    container.scrollTo(0, 0);
  }

  let isPanning = false, startX, startY, scrollLeft, scrollTop;
  container.addEventListener('mousedown', (e) => {
    isPanning = true;
    startX = e.clientX - container.offsetLeft;
    startY = e.clientY - container.offsetTop;
    scrollLeft = container.scrollLeft;
    scrollTop = container.scrollTop;
  });
  container.addEventListener('mouseleave', () => { isPanning = false; });
  container.addEventListener('mouseup', () => { isPanning = false; });
  container.addEventListener('mousemove', (e) => {
    if (!isPanning) return;
    e.preventDefault();
    const x = e.clientX - container.offsetLeft;
    const y = e.clientY - container.offsetTop;
    container.scrollLeft = scrollLeft - (x - startX) * 2;
    container.scrollTop = scrollTop - (y - startY) * 2;
  });
  svg.addEventListener('dragstart', (e) => e.preventDefault());
</script>
