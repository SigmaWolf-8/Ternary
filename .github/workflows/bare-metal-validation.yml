name: Bare-Metal Validation

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/kernel/**'
  pull_request:
    branches: [main]
    paths:
      - 'src/kernel/**'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  bare-metal-x86_64:
    name: "QEMU Boot (x86_64)"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust Nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Install QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/kernel/bare-metal/target
          key: ${{ runner.os }}-bare-metal-${{ hashFiles('src/kernel/Cargo.lock') }}

      - name: Build Kernel (debug)
        working-directory: src/kernel/bare-metal
        run: cargo build

      - name: Boot in QEMU — Run Self-Tests
        working-directory: src/kernel/bare-metal
        run: |
          chmod +x scripts/qemu-run.sh
          ./scripts/qemu-run.sh target/x86_64-ternary-none/debug/ternary-kernel

      - name: Build Kernel (release)
        working-directory: src/kernel/bare-metal
        run: cargo build --release

      - name: Boot Release Build in QEMU
        working-directory: src/kernel/bare-metal
        run: |
          ./scripts/qemu-run.sh target/x86_64-ternary-none/release/ternary-kernel

      - name: Upload Kernel Binary
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: plenumnet-kernel-x86_64
          path: src/kernel/bare-metal/target/x86_64-ternary-none/release/ternary-kernel
