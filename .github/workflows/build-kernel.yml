name: Build Kernel

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/kernel/**'
      - 'src/tsl/**'
      - 'src/thdl/**'
      - 'boot.sh'
  pull_request:
    branches: [main]
    paths:
      - 'src/kernel/**'
      - 'src/tsl/**'
      - 'src/thdl/**'
      - 'boot.sh'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-kernel:
    name: Build Kernel Core
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      RUSTFLAGS: "-D warnings"
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - riscv64gc-unknown-linux-gnu
        features:
          - default
          - no_std
          - finra-613

    steps:
      - uses: actions/checkout@v4

      - name: Check kernel exists
        id: check
        run: |
          if [ -f "src/kernel/Cargo.toml" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "::notice::Kernel source not yet published. Skipping build."
          fi

      - name: Install Rust toolchain
        if: steps.check.outputs.exists == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: steps.check.outputs.exists == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            gcc-riscv64-linux-gnu

      - name: Cache cargo registry
        if: steps.check.outputs.exists == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/kernel/target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('src/kernel/Cargo.lock') }}

      - name: Build kernel
        if: steps.check.outputs.exists == 'true'
        working-directory: src/kernel
        run: |
          cargo build --target ${{ matrix.target }} --features ${{ matrix.features }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER: riscv64-linux-gnu-gcc

      - name: Build kernel (release)
        if: steps.check.outputs.exists == 'true'
        working-directory: src/kernel
        run: |
          cargo build --release --target ${{ matrix.target }} --features ${{ matrix.features }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER: riscv64-linux-gnu-gcc

  build-baremetal:
    name: Build Kernel (Bare-Metal)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-none
            rustflags: "-C code-model=small"
          - arch: aarch64
            target: aarch64-unknown-none
            rustflags: ""
          - arch: riscv64
            target: riscv64gc-unknown-none-elf
            rustflags: ""

    steps:
      - uses: actions/checkout@v4

      - name: Check kernel exists
        id: check
        run: |
          if [ -f "src/kernel/Cargo.toml" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "::notice::Kernel source not yet published. Skipping."
          fi

      - name: Install Rust toolchain
        if: steps.check.outputs.exists == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        if: steps.check.outputs.exists == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/kernel/target
          key: ${{ runner.os }}-cargo-baremetal-${{ matrix.arch }}-${{ hashFiles('src/kernel/Cargo.lock') }}

      - name: Build kernel library (bare-metal)
        if: steps.check.outputs.exists == 'true'
        working-directory: src/kernel
        run: |
          cargo build --lib --target ${{ matrix.target }} --no-default-features --features no_std
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}

      - name: Build kernel binary (bare-metal)
        if: steps.check.outputs.exists == 'true'
        working-directory: src/kernel
        run: |
          cargo build --bin plenumnet-kernel --target ${{ matrix.target }} --no-default-features --features no_std
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}

      - name: Build kernel binary (bare-metal, release)
        if: steps.check.outputs.exists == 'true'
        working-directory: src/kernel
        run: |
          cargo build --bin plenumnet-kernel --release --target ${{ matrix.target }} --no-default-features --features no_std
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}

      - name: Upload kernel artifact
        if: steps.check.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: plenumnet-kernel-${{ matrix.arch }}
          path: src/kernel/target/${{ matrix.target }}/release/plenumnet-kernel
          if-no-files-found: warn

  qemu-smoke-test:
    name: QEMU Smoke Test
    runs-on: ubuntu-latest
    needs: build-baremetal
    strategy:
      matrix:
        include:
          - arch: x86_64
            qemu_pkg: qemu-system-x86
            qemu_cmd: >-
              qemu-system-x86_64
              -machine q35 -cpu qemu64 -m 128M
              -nographic -serial stdio -no-reboot
              -device isa-debugexit,iobase=0xf4,iosize=0x04
              -kernel
          - arch: aarch64
            qemu_pkg: qemu-system-arm
            qemu_cmd: >-
              qemu-system-aarch64
              -machine virt -cpu cortex-a57 -m 128M
              -nographic -serial stdio -no-reboot
              -kernel
          - arch: riscv64
            qemu_pkg: qemu-system-misc
            qemu_cmd: >-
              qemu-system-riscv64
              -machine virt -cpu rv64 -m 128M
              -nographic -serial stdio -no-reboot
              -bios default -kernel

    steps:
      - uses: actions/checkout@v4

      - name: Download kernel artifact
        uses: actions/download-artifact@v4
        with:
          name: plenumnet-kernel-${{ matrix.arch }}
          path: ./kernel-bin

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.qemu_pkg }}

      - name: Run QEMU smoke test
        run: |
          KERNEL="./kernel-bin/plenumnet-kernel"
          if [ ! -f "${KERNEL}" ]; then
            echo "::warning::Kernel binary not found, skipping smoke test"
            exit 0
          fi
          chmod +x "${KERNEL}" 2>/dev/null || true
          SENTINEL="PLENUMNET KERNEL BOOT OK"
          LOG=$(mktemp)
          set +e
          timeout 15 ${{ matrix.qemu_cmd }} "${KERNEL}" 2>&1 | tee "${LOG}"
          QEMU_EXIT=$?
          set -e
          echo "QEMU exited with code ${QEMU_EXIT}"
          if grep -q "${SENTINEL}" "${LOG}"; then
            echo "::notice::Sentinel found — ${{ matrix.arch }} boot OK"
          else
            echo "::error::Sentinel not found in QEMU output (${{ matrix.arch }})"
            echo "--- QEMU output ---"
            cat "${LOG}"
            echo "---"
            exit 1
          fi

  build-tsl:
    name: Build TSL Compiler
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Check TSL exists
        id: check
        run: |
          if [ -f "src/tsl/Cargo.toml" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "::notice::TSL compiler source not yet published. Skipping build."
          fi

      - name: Install Rust toolchain
        if: steps.check.outputs.exists == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        if: steps.check.outputs.exists == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/tsl/target
          key: ${{ runner.os }}-cargo-tsl-${{ hashFiles('src/tsl/Cargo.lock') }}

      - name: Build TSL compiler
        if: steps.check.outputs.exists == 'true'
        working-directory: src/tsl
        run: cargo build --release 2>&1 || echo "::warning::TSL build has warnings or errors (non-blocking)"

  build-thdl:
    name: Build THDL Synthesizer
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Check THDL exists
        id: check
        run: |
          if [ -f "src/thdl/Cargo.toml" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "::notice::THDL synthesizer source not yet published. Skipping build."
          fi

      - name: Install Rust toolchain
        if: steps.check.outputs.exists == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        if: steps.check.outputs.exists == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/thdl/target
          key: ${{ runner.os }}-cargo-thdl-${{ hashFiles('src/thdl/Cargo.lock') }}

      - name: Build THDL synthesizer
        if: steps.check.outputs.exists == 'true'
        working-directory: src/thdl
        run: cargo build --release 2>&1 || echo "::warning::THDL build has warnings or errors (non-blocking)"

  build-services:
    name: Build Microservices
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        service:
          - payment-listener
          - sfk-core-api
          - blockchain/hedera-service
          - blockchain/xrpl-service
          - blockchain/algorand-service
          - timing/femtosecond-service
          - timing/certification-service

    steps:
      - uses: actions/checkout@v4

      - name: Check service exists
        id: check
        run: |
          if [ -d "services/${{ matrix.service }}" ] && [ -f "services/${{ matrix.service }}/package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "::notice::Service services/${{ matrix.service }} not yet published. Skipping."
          fi

      - name: Setup Node.js
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        if: steps.check.outputs.exists == 'true'
        working-directory: services/${{ matrix.service }}
        continue-on-error: true
        run: npm ci --ignore-scripts 2>/dev/null || npm install --ignore-scripts

      - name: Lint check
        if: steps.check.outputs.exists == 'true'
        working-directory: services/${{ matrix.service }}
        continue-on-error: true
        run: npx --yes eslint . --ext .js,.ts 2>/dev/null || true
