name: TypeScript Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'server/**'
      - 'shared/**'
      - 'tests/**'
      - 'vitest.config.ts'
  pull_request:
    branches: [main]
    paths:
      - 'server/**'
      - 'shared/**'
      - 'tests/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript tests
        env:
          SESSION_SECRET: ci-test-secret-not-for-production
        run: npx vitest run --reporter=verbose --exclude='tests/integration/**'

      - name: Type check
        run: npx tsc --noEmit
