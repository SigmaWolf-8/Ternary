name: CI - SalviSign

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'salvi-sign/**'
    paths:
      - 'salvi-sign/**'
  pull_request:
    paths:
      - 'salvi-sign/**'

jobs:
  lint-and-typecheck:
    name: Lint & Type Check (salvi-sign)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: salvi-sign

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: salvi-sign/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check (tsc)
        run: npx tsc --noEmit

  build:
    name: Build Check (salvi-sign)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: salvi-sign

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: salvi-sign/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
