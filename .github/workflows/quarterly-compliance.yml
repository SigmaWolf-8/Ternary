name: Quarterly Compliance Report

on:
  schedule:
    - cron: '0 9 1 1,4,7,10 *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-report:
    name: Generate Quarterly Compliance Report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Generate compliance report
        run: node scripts/quarterly-compliance-report.cjs

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          YEAR=$(date +%Y)
          QUARTER=$(( ($(date +%-m) - 1) / 3 + 1 ))
          REPORT_FILE="docs/compliance/reports/quarterly-${YEAR}-Q${QUARTER}.md"
          if [ -f "$REPORT_FILE" ]; then
            git add "$REPORT_FILE"
            git commit -m "chore(compliance): add quarterly report ${YEAR}-Q${QUARTER}" || echo "No changes to commit"
            git push
          else
            echo "Report file not found: $REPORT_FILE"
            exit 1
          fi
