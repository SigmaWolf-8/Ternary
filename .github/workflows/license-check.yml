name: License Header Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check-headers:
    name: "Verify Copyright Headers"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check source files for copyright headers
        run: |
          echo "============================================"
          echo "  COPYRIGHT HEADER VERIFICATION"
          echo "  Checking all source files for headers"
          echo "============================================"

          MISSING=$(find \
            ternary-math/src/ \
            src/kernel/src/ \
            src/tsl/src/ \
            src/thdl/src/ \
            server/ \
            client/src/ \
            shared/ \
            libternary/src/ \
            services/ \
            -type f \
            \( -name "*.rs" -o -name "*.ts" -o -name "*.tsx" -o -name "*.js" -o -name "*.jsx" -o -name "*.py" \) \
            -not -name "*.d.ts" \
            -not -path "*/node_modules/*" \
            -exec grep -L "Capomastro Holdings" {} \; 2>/dev/null)

          if [ -n "$MISSING" ]; then
            echo ""
            echo "  The following files are missing copyright headers:"
            echo "$MISSING" | while read -r f; do echo "    - $f"; done
            echo ""
            echo "  Apply headers from FILE-HEADER-TEMPLATE.md"
            echo "  See: https://github.com/SigmaWolf-8/Ternary/blob/main/FILE-HEADER-TEMPLATE.md"
            exit 1
          fi

          TOTAL=$(find \
            ternary-math/src/ \
            src/kernel/src/ \
            src/tsl/src/ \
            src/thdl/src/ \
            server/ \
            client/src/ \
            shared/ \
            libternary/src/ \
            services/ \
            -type f \
            \( -name "*.rs" -o -name "*.ts" -o -name "*.tsx" -o -name "*.js" -o -name "*.jsx" -o -name "*.py" \) \
            -not -name "*.d.ts" \
            -not -path "*/node_modules/*" 2>/dev/null | wc -l)

          echo "  All $TOTAL source files have copyright headers."
          echo "  Capomastro Holdings Ltd. (Canada)"
