name: XPlenum RISC-V Extension CI

on:
  push:
    paths:
      - 'rtl/**'
      - 'tb/**'
      - 'src/kernel/src/arch/xplenum.rs'
      - 'src/kernel/src/security/xplenum_hal.rs'
      - 'src/kernel/src/security/xplenum_tests.rs'
      - 'scripts/xplenum_drbg_nist_sts.py'
      - '.github/workflows/xplenum-riscv.yml'
  pull_request:
    paths:
      - 'rtl/**'
      - 'tb/**'
      - 'src/kernel/src/arch/xplenum.rs'
      - 'src/kernel/src/security/xplenum_hal.rs'

jobs:
  rtl-lint:
    name: RTL Lint & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Verilator
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator

      - name: Lint AES-256 Core
        run: |
          verilator --lint-only -Wall \
            -I rtl \
            rtl/xplenum_aes256_core.v

      - name: Lint CTR_DRBG Module
        run: |
          verilator --lint-only -Wall \
            -I rtl \
            rtl/xplenum_ctr_drbg.v

      - name: Lint Mask Unit (DRBG-integrated)
        run: |
          verilator --lint-only -Wall \
            -I rtl \
            rtl/xplenum_mask_unit.v

      - name: Lint Top Module
        run: |
          verilator --lint-only -Wall \
            -I rtl \
            rtl/xplenum_top.v

  rtl-simulate:
    name: RTL Simulation (Icarus Verilog)
    runs-on: ubuntu-latest
    needs: rtl-lint
    steps:
      - uses: actions/checkout@v4

      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog

      - name: Compile DRBG Testbench
        run: |
          iverilog -g2012 -o tb/drbg_tb.vvp \
            -I rtl \
            rtl/xplenum_pkg.vh \
            rtl/xplenum_aes256_core.v \
            rtl/xplenum_ctr_drbg.v \
            rtl/xplenum_mask_unit.v \
            tb/xplenum_drbg_tb.v

      - name: Run DRBG Testbench
        run: |
          cd tb && vvp drbg_tb.vvp | tee drbg_results.log
          grep -q "ALL TESTS PASSED" drbg_results.log

      - name: Compile Integration Testbench
        run: |
          iverilog -g2012 -o tb/integration_tb.vvp \
            -I rtl \
            rtl/xplenum_pkg.vh \
            rtl/xplenum_aes256_core.v \
            rtl/xplenum_ctr_drbg.v \
            rtl/xplenum_mask_unit.v \
            rtl/xplenum_domain_unit.v \
            rtl/xplenum_capability_unit.v \
            rtl/xplenum_crypto_unit.v \
            rtl/xplenum_trit_unit.v \
            rtl/xplenum_signal_unit.v \
            rtl/xplenum_top.v \
            tb/xplenum_cva6_integration_tb.v

      - name: Run Integration Testbench
        run: |
          cd tb && vvp integration_tb.vvp | tee integration_results.log
          grep -q "ALL.*PASS" integration_results.log

      - name: Upload Simulation Logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulation-logs
          path: tb/*.log

  rust-kernel-build:
    name: Rust Kernel Build (RISC-V Target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: riscv64gc-unknown-none-elf
          components: rust-src

      - name: Build kernel (RISC-V target — syntax check)
        working-directory: src/kernel
        run: |
          cargo check --target riscv64gc-unknown-none-elf

      - name: Run unit tests (host target)
        working-directory: src/kernel
        run: |
          cargo test --lib -- xplenum

  formal-verification:
    name: Formal Verification (SymbiYosys)
    runs-on: ubuntu-latest
    needs: rtl-lint
    steps:
      - uses: actions/checkout@v4

      - name: Install SymbiYosys
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys
          pip3 install sby

      - name: Check formal property files
        run: |
          echo "Formal property count:"
          grep -c "assert\|assume\|cover" rtl/formal/*.v || echo "No formal files"

  drbg-statistical:
    name: DRBG Statistical Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate test data (urandom reference)
        run: |
          dd if=/dev/urandom bs=125000 count=1 of=/tmp/test_drbg.bin 2>/dev/null

      - name: Run NIST STS on reference data
        run: |
          python3 scripts/xplenum_drbg_nist_sts.py /tmp/test_drbg.bin --bits 100000

      - name: Validate script syntax
        run: |
          python3 -m py_compile scripts/xplenum_drbg_nist_sts.py
