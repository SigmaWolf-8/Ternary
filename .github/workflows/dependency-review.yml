# ══════════════════════════════════════════════════════════════
# Salvi Framework — Dependency Review
# Capomastro Holdings Ltd. · Applied Physics Division
#
# Runs on pull requests only — reviews new/updated dependencies
# for known vulnerabilities and license compliance.
# ══════════════════════════════════════════════════════════════

name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: AGPL-3.0, GPL-3.0
