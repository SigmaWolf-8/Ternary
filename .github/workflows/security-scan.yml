name: Security Scan

on:
  push:
    branches: [main]
    paths:
      - 'src/kernel/**'
      - 'src/tsl/**'
      - 'src/thdl/**'
      - '**/*.ts'
      - '**/*.js'
      - '**/*.tsx'
      - '**/*.jsx'
      - 'server/**'
      - 'client/**'
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  cargo-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Check Rust projects exist
        id: check
        run: |
          if [ -f "src/kernel/Cargo.toml" ]; then
            echo "has_kernel=true" >> $GITHUB_OUTPUT
          else
            echo "has_kernel=false" >> $GITHUB_OUTPUT
          fi
          if [ -f "src/tsl/Cargo.toml" ]; then
            echo "has_tsl=true" >> $GITHUB_OUTPUT
          else
            echo "has_tsl=false" >> $GITHUB_OUTPUT
          fi
          if [ -f "src/thdl/Cargo.toml" ]; then
            echo "has_thdl=true" >> $GITHUB_OUTPUT
          else
            echo "has_thdl=false" >> $GITHUB_OUTPUT
          fi

      - name: Install Rust toolchain
        if: steps.check.outputs.has_kernel == 'true' || steps.check.outputs.has_tsl == 'true' || steps.check.outputs.has_thdl == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        if: steps.check.outputs.has_kernel == 'true' || steps.check.outputs.has_tsl == 'true' || steps.check.outputs.has_thdl == 'true'
        run: cargo install cargo-audit

      - name: Audit kernel dependencies
        if: steps.check.outputs.has_kernel == 'true'
        working-directory: src/kernel
        run: cargo audit 2>&1 || true

      - name: Audit TSL dependencies
        if: steps.check.outputs.has_tsl == 'true'
        working-directory: src/tsl
        run: cargo audit 2>&1 || true

      - name: Audit THDL dependencies
        if: steps.check.outputs.has_thdl == 'true'
        working-directory: src/thdl
        run: cargo audit 2>&1 || true

      - name: Skip notice
        if: steps.check.outputs.has_kernel == 'false' && steps.check.outputs.has_tsl == 'false' && steps.check.outputs.has_thdl == 'false'
        run: echo "::notice::No Rust projects found. Dependency audit skipped."

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  npm-audit:
    name: npm Dependency Audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: |
          echo "=== npm Dependency Audit ==="
          npm audit --audit-level=moderate 2>&1 || true

      - name: Check for critical/high vulnerabilities
        run: |
          AUDIT_JSON=$(npm audit --json 2>/dev/null || true)
          HIGH=$(echo "$AUDIT_JSON" | node -e "
            const d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));
            const v=d.metadata?.vulnerabilities||{};
            console.log((v.high||0)+(v.critical||0));
          " 2>/dev/null || echo "0")
          if [ "$HIGH" -gt "0" ]; then
            echo "::warning::Found $HIGH high/critical npm vulnerabilities. Review npm audit output."
          else
            echo "::notice::No high/critical npm vulnerabilities found."
          fi

      - name: License compliance check
        run: |
          npx license-checker --failOn "AGPL-1.0-only;AGPL-1.0-or-later;AGPL-3.0-only;AGPL-3.0-or-later;GPL-2.0-only;GPL-2.0-or-later;GPL-3.0-only;GPL-3.0-or-later" 2>&1 || true
          echo ""
          echo "=== License Summary ==="
          npx license-checker --summary 2>&1

  gitleaks:
    name: Secret Detection
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        id: gitleaks
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

      - name: Gitleaks result
        run: |
          if [ "${{ steps.gitleaks.outcome }}" == "failure" ]; then
            echo "::warning::Gitleaks detected potential secrets. Review findings above."
          else
            echo "::notice::No secrets detected."
          fi

  clippy:
    name: Clippy Lints
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Check Rust projects exist
        id: check
        run: |
          if [ -f "src/kernel/Cargo.toml" ]; then
            echo "has_kernel=true" >> $GITHUB_OUTPUT
          else
            echo "has_kernel=false" >> $GITHUB_OUTPUT
          fi
          if [ -f "src/tsl/Cargo.toml" ]; then
            echo "has_tsl=true" >> $GITHUB_OUTPUT
          else
            echo "has_tsl=false" >> $GITHUB_OUTPUT
          fi
          if [ -f "src/thdl/Cargo.toml" ]; then
            echo "has_thdl=true" >> $GITHUB_OUTPUT
          else
            echo "has_thdl=false" >> $GITHUB_OUTPUT
          fi

      - name: Install Rust toolchain
        if: steps.check.outputs.has_kernel == 'true' || steps.check.outputs.has_tsl == 'true' || steps.check.outputs.has_thdl == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Clippy kernel
        if: steps.check.outputs.has_kernel == 'true'
        working-directory: src/kernel
        run: |
          cargo clippy --all-features -- -W warnings \
            -A clippy::module_name_repetitions \
            -A clippy::must_use_candidate \
            -A clippy::missing_errors_doc \
            -A clippy::missing_panics_doc \
            -A clippy::cast_possible_truncation \
            -A clippy::cast_sign_loss \
            -A clippy::cast_lossless \
            -A clippy::cast_possible_wrap \
            -A clippy::similar_names \
            -A clippy::too_many_lines \
            -A clippy::unreadable_literal \
            -A clippy::wildcard_imports \
            -A dead_code \
            2>&1 || true

      - name: Clippy TSL
        if: steps.check.outputs.has_tsl == 'true'
        working-directory: src/tsl
        run: cargo clippy --all-features -- -W warnings -A dead_code 2>&1 || true

      - name: Clippy THDL
        if: steps.check.outputs.has_thdl == 'true'
        working-directory: src/thdl
        run: cargo clippy --all-features -- -W warnings -A dead_code 2>&1 || true

      - name: Skip notice
        if: steps.check.outputs.has_kernel == 'false' && steps.check.outputs.has_tsl == 'false' && steps.check.outputs.has_thdl == 'false'
        run: echo "::notice::No Rust projects found. Clippy lints skipped."
