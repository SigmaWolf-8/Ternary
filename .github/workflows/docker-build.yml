name: Docker Build

on:
  push:
    branches: [main]
    paths:
      - 'deployments/docker/**'
      - 'docker-compose.yml'
      - '.github/workflows/docker-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'deployments/docker/**'
      - 'docker-compose.yml'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  check-dockerfiles:
    name: Check Dockerfiles
    runs-on: ubuntu-latest
    outputs:
      has_kernel_dockerfile: ${{ steps.check.outputs.has_kernel }}
      has_compose: ${{ steps.check.outputs.has_compose }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for Docker files
        id: check
        run: |
          if [ -f "deployments/docker/Dockerfile.kernel" ]; then
            echo "has_kernel=true" >> $GITHUB_OUTPUT
          else
            echo "has_kernel=false" >> $GITHUB_OUTPUT
          fi
          if [ -f "deployments/docker/docker-compose.yml" ] || [ -f "docker-compose.yml" ]; then
            echo "has_compose=true" >> $GITHUB_OUTPUT
          else
            echo "has_compose=false" >> $GITHUB_OUTPUT
          fi

  build-kernel-image:
    name: Build Kernel Image
    runs-on: ubuntu-latest
    needs: check-dockerfiles
    if: needs.check-dockerfiles.outputs.has_kernel_dockerfile == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/kernel
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployments/docker/Dockerfile.kernel
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest
    needs: build-kernel-image
    if: needs.check-dockerfiles.outputs.has_kernel_dockerfile == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/kernel:sha-${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
        if: always()
        continue-on-error: true

  placeholder:
    name: Docker Build (Placeholder)
    runs-on: ubuntu-latest
    needs: check-dockerfiles
    if: needs.check-dockerfiles.outputs.has_kernel_dockerfile == 'false'
    steps:
      - uses: actions/checkout@v4

      - name: Docker build status
        run: |
          echo "=== Docker Build Status ==="
          echo ""
          echo "No Dockerfiles found yet. Docker images will be built when:"
          echo "  - deployments/docker/Dockerfile.kernel is created"
          echo "  - deployments/docker/docker-compose.yml is configured"
          echo ""
          echo "Planned images:"
          echo "  - ghcr.io/${{ github.repository }}/kernel"
          echo "  - ghcr.io/${{ github.repository }}/timing-api"
          echo "  - ghcr.io/${{ github.repository }}/payment-listener"
